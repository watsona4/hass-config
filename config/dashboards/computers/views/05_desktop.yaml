    entity: binary_sensor.desktop_status_alarm
    icon: "{{ state_attr('sensor.ui_desktop_status_alarm', 'icon') }}"
    color: "{{ state_attr('sensor.ui_desktop_status_alarm', 'color') }}"
    label: Status
    content: "{{ state_attr('sensor.ui_desktop_status_alarm', 'short_label') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.desktop_uptime_s
    icon: "{{ state_attr('sensor.ui_desktop_uptime_s', 'icon') }}"
    color: "{{ state_attr('sensor.ui_desktop_uptime_s', 'color') }}"
    label: Uptime
    content: "{{ state_attr('sensor.ui_desktop_uptime_s', 'short_label') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.desktop_cpu_load_1m
    icon: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'icon') }}"
    color: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'color') }}"
    label: CPU Load
    content: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'short_label') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.desktop_cpu_utilization
    icon: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'icon') }}"
    color: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'color') }}"
    label: CPU
    content: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'short_label') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.desktop_cpu_temp
    icon: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'icon') }}"
    color: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'color') }}"
    label: CPU Temp
    content: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'short_label') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.desktop_memory_percent
    icon: "{{ state_attr('sensor.ui_desktop_memory_percent', 'icon') }}"
    color: "{{ state_attr('sensor.ui_desktop_memory_percent', 'color') }}"
    label: Memory
    content: "{{ state_attr('sensor.ui_desktop_memory_percent', 'short_label') }}"
    tap_action:
      action: more-info

sections:

  - type: grid
    column_span: 1
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: System Status
            subtitle: Health overview and pending updates
          - type: markdown
            content: |
              {% set packages = state_attr('sensor.desktop_updates_list', 'packages') | default([]) %}
              **Available Updates:**
              {%- for pkg in packages %}
                - {{ pkg }}
              {%- endfor %}
            visibility:
              - condition: numeric_state
                entity: sensor.desktop_updates_pending
                above: 0
            card_mod:
              style: |
                ha-card {
                  background: rgba(var(--rgb-primary-color), 0.1);
                  font-size: 0.9em;
                }
          - type: custom:mushroom-template-card
            entity: binary_sensor.desktop_status_alarm
            icon: "{{ state_attr('sensor.ui_desktop_status_alarm', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_status_alarm', 'color') }}"
            primary: Health Status
            secondary: "{{ state_attr('sensor.ui_desktop_status_alarm', 'long_desc') }}"
            tap_action:
              action: more-info

  - type: grid
    column_span: 1
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: CPU
          - type: custom:mushroom-template-card
            entity: sensor.desktop_cpu_load_1m
            icon: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'color') }}"
            primary: CPU Load (1m/5m/15m)
            secondary: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'long_desc') }}"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.desktop_cpu_temp
            icon: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'color') }}"
            primary: CPU Temperature
            secondary: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'label') }}"
            tap_action:
              action: more-info

  - type: grid
    column_span: 1
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Memory
          - type: custom:mushroom-template-card
            entity: sensor.desktop_swap_percent
            icon: "{{ state_attr('sensor.ui_desktop_swap_percent', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_swap_percent', 'color') }}"
            primary: "Swap ({{ state_attr('sensor.ui_desktop_swap_percent', 'value') }} used)"
            secondary: "{{ state_attr('sensor.ui_desktop_swap_percent', 'long_desc') }}"
            tap_action:
              action: more-info

  - type: grid
    column_span: 1
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Storage
            subtitle: Disk capacity and performance
          - type: custom:mushroom-template-card
            entity: sensor.desktop_fs_windows_c_percent
            icon: "{{ state_attr('sensor.ui_desktop_fs_windows_c', 'fs_icon') | default('mdi:folder') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_fs_windows_c', 'fs_color') | default('green') }}"
            primary: Windows (C:)
            secondary: "{{ state_attr('sensor.ui_desktop_fs_windows_c', 'fs_secondary') | default('') }}"
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.desktop_fs_data_d_percent
            icon: "{{ state_attr('sensor.ui_desktop_fs_data_d', 'fs_icon') | default('mdi:folder') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_fs_data_d', 'fs_color') | default('green') }}"
            primary: Data (D:)
            secondary: "{{ state_attr('sensor.ui_desktop_fs_data_d', 'fs_secondary') | default('') }}"
            multiline_secondary: true
            tap_action:
              action: more-info

  - type: grid
    column_span: 1
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Network
            subtitle: Interface status and connectivity
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wifi_info
            icon: "{{ state_attr('sensor.ui_desktop_network_wifi','iface_icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_network_wifi','iface_color') }}"
            primary: "{{ state_attr('sensor.desktop_wifi_info', 'name') }}"
            secondary: "{{ state_attr('sensor.ui_desktop_network_wifi','long_desc') }}"
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wifi_signal
            icon: >-
              {%- set sig = states('sensor.desktop_wifi_signal') | int(0) -%}
              {{ 'mdi:wifi-strength-4' if sig > 75 else 'mdi:wifi-strength-3' if sig > 50 else 'mdi:wifi-strength-2' if sig > 25 else 'mdi:wifi-strength-1' if sig > 0 else 'mdi:wifi-off' }}
            icon_color: >-
              {%- set sig = states('sensor.desktop_wifi_signal') | int(0) -%}
              {{ 'green' if sig > 60 else 'orange' if sig > 30 else 'red' }}
            primary: "{{ states('sensor.desktop_wifi_network') | default('Not Connected') }}"
            secondary: >-
              {%- set sig = states('sensor.desktop_wifi_signal') | default('?') -%}
              {%- set dbm = states('sensor.desktop_wifi_signal_dbm') | default('?') -%}
              {%- set ch = states('sensor.desktop_wifi_channel') | default('?') -%}
              {%- set rate = states('sensor.desktop_wifi_bitrate') | default('?') -%}
              {%- set auth = states('sensor.desktop_wifi_auth') | default('') -%}
              {%- set radio = states('sensor.desktop_wifi_radio') | default('') -%}
              {{ sig }}% ({{ dbm }} dBm) | Ch {{ ch }}
              {{ rate }} Mbps{{ ' | ' ~ radio if radio else '' }}{{ ' | ' ~ auth if auth else '' }}
            multiline_secondary: true
            tap_action:
              action: more-info

  - type: grid
    column_span: 1
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: GPU
            subtitle: Graphics processor load and thermals
          - type: custom:mushroom-template-card
            entity: sensor.desktop_bq063ig_desktop_bq063ig_hardware_telemetry
            icon: mdi:expansion-card
            icon_color: >-
              {% set gpus = state_attr('sensor.desktop_bq063ig_desktop_bq063ig_hardware_telemetry', 'gpus') | default([], true) -%}
              {% set g = gpus[0] if gpus and gpus | length > 0 else none -%}
              {% set core = g['core'] | default({}) if g else {} -%}
              {% set load = core['load_pct'] | default(0) | float -%}
              {% if load > 90 -%}red
              {% elif load > 70 -%}orange
              {% elif load > 30 -%}yellow
              {% else -%}green
              {% endif -%}
            primary: >-
              {% set gpus = state_attr('sensor.desktop_bq063ig_desktop_bq063ig_hardware_telemetry', 'gpus') | default([], true) -%}
              {% set g = gpus[0] if gpus and gpus | length > 0 else none -%}
              {% set core = g['core'] | default({}) if g else {} -%}
              {% set load = core['load_pct'] | default(0) | round(0) | int -%}
              GPU ({{- load -}}%)
            secondary: >-
              {% set gpus = state_attr('sensor.desktop_bq063ig_desktop_bq063ig_hardware_telemetry', 'gpus') | default([], true) -%}
              {% set g = gpus[0] if gpus and gpus | length > 0 else none -%}
              {% if not g -%}No GPU data
              {% else -%}
              {% set temp = g['temp_c'] | default(0) | round(0) | int -%}
              {% set core = g['core'] | default({}) -%}
              {% set soc = g['soc'] | default({}) -%}
              {% set core_power = core['power_w'] | default(0) | round(1) -%}
              {% set soc_power = soc['power_w'] | default(0) | round(1) -%}
              {% set voltage = soc['voltage_v'] | default(0) | round(2) -%}
              {% set total_power = core_power + soc_power -%}
              {% set ns = namespace(lines=[]) -%}
              {% if temp > 0 -%}{% set ns.lines = ns.lines + [temp | string ~ '°C'] -%}{% endif -%}
              {% if total_power > 0 -%}{% set ns.lines = ns.lines + [total_power | round(1) | string ~ ' W'] -%}{% endif -%}
              {% if voltage > 0 -%}{% set ns.lines = ns.lines + [voltage | string ~ ' V'] -%}{% endif -%}
              {{- ns.lines | join(' | ') if ns.lines else 'Idle' -}}
              {% endif -%}
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.desktop_gpu_temp
            icon: "{{ state_attr('sensor.ui_desktop_gpu_temp', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_gpu_temp', 'color') }}"
            primary: GPU Temperature
            secondary: "{{ state_attr('sensor.ui_desktop_gpu_temp', 'label') }}"
            tap_action:
              action: more-info

  - type: grid
    column_span: 1
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Services
            subtitle: Monitored system services
          - type: custom:mushroom-template-card
            entity: binary_sensor.desktop_services_ok
            icon: mdi:cog
            icon_color: "{{ 'green' if is_state('binary_sensor.desktop_services_ok', 'on') else 'red' }}"
            primary: Services Status
            secondary: "{{ states('sensor.desktop_services_checked') }} monitored"
            tap_action:
              action: more-info
