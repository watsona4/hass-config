title: Desktop
path: desktop
type: sections
max_columns: 2

badges:
  - type: custom:mushroom-template-badge
    entity: sensor.desktop_cpu_utilization
    icon: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'icon') }}"
    color: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'color') }}"
    content: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'short_label') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.desktop_memory_percent
    icon: "{{ state_attr('sensor.ui_desktop_memory_percent', 'icon') }}"
    color: "{{ state_attr('sensor.ui_desktop_memory_percent', 'color') }}"
    content: "{{ state_attr('sensor.ui_desktop_memory_percent', 'short_label') }}"
    tap_action:
      action: more-info

sections:
  # System Status
  - type: grid
    column_span: 2
    cards:
      - type: custom:mushroom-title-card
        title: Desktop
        subtitle: "{{ states('sensor.desktop_overall_status_summary') }}"
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.desktop_uptime_s
            icon: "{{ state_attr('sensor.ui_desktop_uptime_s', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_uptime_s', 'color') }}"
            primary: Uptime
            secondary: "{{ state_attr('sensor.ui_desktop_uptime_s', 'label_vertical') }}"
            layout: vertical
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: sensor.desktop_updates_pending
            icon: "{{ state_attr('sensor.ui_desktop_updates_pending', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_updates_pending', 'color') }}"
            primary: Updates
            secondary: "{{ state_attr('sensor.ui_desktop_updates_pending', 'label_vertical') }}"
            layout: vertical
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: binary_sensor.desktop_status_alarm
            icon: "{{ state_attr('sensor.ui_desktop_status_alarm', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_status_alarm', 'color') }}"
            primary: Status
            layout: vertical
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
      - type: markdown
        content: |
          **Available Updates:**
          {%- set packages = state_attr('sensor.desktop_updates_list', 'packages') | default([]) %}
          {% for pkg in packages %}
          - {{ pkg }}
          {% endfor %}
        visibility:
          - condition: numeric_state
            entity: sensor.desktop_updates_pending
            above: 0
        card_mod:
          style: |
            ha-card {
              background: rgba(var(--rgb-primary-color), 0.1);
              font-size: 0.9em;
            }

  # CPU
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: CPU
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: sensor.desktop_cpu_utilization
        icon: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'icon') }}"
        icon_color: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'color') }}"
        primary: Utilization
        secondary: "{{ state_attr('sensor.ui_desktop_cpu_utilization', 'label') }}"
        tap_action:
          action: more-info
        icon_tap_action:
          action: toggle
      - type: custom:mushroom-template-card
        entity: sensor.desktop_cpu_load_1m
        icon: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'icon') }}"
        icon_color: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'color') }}"
        primary: Load Average
        secondary: "{{ state_attr('sensor.ui_desktop_cpu_load_1m', 'long_desc') }}"
        tap_action:
          action: more-info
        icon_tap_action:
          action: toggle
      - type: custom:mushroom-template-card
        entity: sensor.desktop_cpu_temp
        icon: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'icon') }}"
        icon_color: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'color') }}"
        primary: Temperature
        secondary: "{{ state_attr('sensor.ui_desktop_cpu_temp', 'label') }}"
        tap_action:
          action: more-info
        icon_tap_action:
          action: toggle

  # Memory
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Memory
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: sensor.desktop_memory_percent
        icon: "{{ state_attr('sensor.ui_desktop_memory_percent', 'icon') }}"
        icon_color: "{{ state_attr('sensor.ui_desktop_memory_percent', 'color') }}"
        primary: Usage
        secondary: "{{ state_attr('sensor.ui_desktop_memory_percent', 'long_desc') }}"
        tap_action:
          action: more-info
        icon_tap_action:
          action: toggle
      - type: custom:mushroom-template-card
        entity: sensor.desktop_swap_percent
        icon: mdi:swap-horizontal
        icon_color: purple
        primary: Swap
        secondary: "{{ states('sensor.desktop_swap_percent') }}%"
        tap_action:
          action: more-info
        icon_tap_action:
          action: toggle

  # Filesystems
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Filesystems
        heading_style: subtitle
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.desktop_fs_windows_(c:)_percent
            icon: "{{ state_attr('sensor.ui_desktop_fs_windows_(c:)_percent', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_fs_windows_(c:)_percent', 'color') }}"
            primary: Windows (C:)
            secondary: "{{ state_attr('sensor.ui_desktop_fs_windows_(c:)_percent', 'long_desc') }}"
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: sensor.desktop_fs_data_(d:)_percent
            icon: "{{ state_attr('sensor.ui_desktop_fs_data_(d:)_percent', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_desktop_fs_data_(d:)_percent', 'color') }}"
            primary: Data (D:)
            secondary: "{{ state_attr('sensor.ui_desktop_fs_data_(d:)_percent', 'long_desc') }}"
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle

  # Network
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Network Interfaces
        heading_style: subtitle
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wifi_ipv4
            icon: mdi:ethernet
            icon_color: blue
            primary: WiFi
            secondary: "{{ states('sensor.desktop_wifi_ipv4') }}"
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle

  # Services
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Services
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: binary_sensor.desktop_services_ok
        icon: mdi:cog
        icon_color: "{{ 'green' if is_state('binary_sensor.desktop_services_ok', 'on') else 'red' }}"
        primary: Services Status
        secondary: "{{ states('sensor.desktop_services_checked') }} monitored"
        tap_action:
          action: more-info
        icon_tap_action:
          action: toggle

  # GPU
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: GPU
        heading_style: subtitle
      - type: custom:mushroom-template-card
        entity: sensor.desktop_gpu_utilization
        icon: "{{ state_attr('sensor.ui_desktop_gpu_utilization', 'icon') }}"
        icon_color: "{{ state_attr('sensor.ui_desktop_gpu_utilization', 'color') }}"
        primary: GPU Utilization
        secondary: "{{ state_attr('sensor.ui_desktop_gpu_utilization', 'label') }}"
        tap_action:
          action: more-info
        icon_tap_action:
          action: toggle

  # Drives
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Storage
        heading_style: subtitle
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.desktop_sk_hynix_256gb_ssd_temp
            icon: "{{ 'mdi:harddisk' if state_attr('sensor.desktop_sk_hynix_256gb_ssd_info', 'type') == 'HDD' else 'mdi:flash' }}"
            icon_color: blue
            primary: "{{ state_attr('sensor.desktop_sk_hynix_256gb_ssd_info', 'model') | default('SK hynix 256GB SSD') | truncate(25, True) }}"
            secondary: >-
              {%- set used = states('sensor.desktop_sk_hynix_256gb_ssd_used') | float(0) -%}
              {%- set avail = states('sensor.desktop_sk_hynix_256gb_ssd_available') | float(0) -%}}
              {%- set pct = states('sensor.desktop_sk_hynix_256gb_ssd_pct_used') | float(0) -%}}
              {%- set temp = states('sensor.desktop_sk_hynix_256gb_ssd_temp') -%}
              {{ used | round(0) }}G used · {{ avail | round(0) }}G free · {{ pct | round(0) }}%{% if temp not in ['unknown', 'unavailable'] %} · {{ temp }}°C{% endif %}
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wd_1tb_hdd_temp
            icon: "{{ 'mdi:harddisk' if state_attr('sensor.desktop_wd_1tb_hdd_info', 'type') == 'HDD' else 'mdi:flash' }}"
            icon_color: blue
            primary: "{{ state_attr('sensor.desktop_wd_1tb_hdd_info', 'model') | default('WD 1TB HDD') | truncate(25, True) }}"
            secondary: >-
              {%- set used = states('sensor.desktop_wd_1tb_hdd_used') | float(0) -%}
              {%- set avail = states('sensor.desktop_wd_1tb_hdd_available') | float(0) -%}}
              {%- set pct = states('sensor.desktop_wd_1tb_hdd_pct_used') | float(0) -%}}
              {%- set temp = states('sensor.desktop_wd_1tb_hdd_temp') -%}
              {{ used | round(0) }}G used · {{ avail | round(0) }}G free · {{ pct | round(0) }}%{% if temp not in ['unknown', 'unavailable'] %} · {{ temp }}°C{% endif %}
            multiline_secondary: true
            tap_action:
              action: more-info

  # SMART Info
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Drive Health (SMART)
        heading_style: subtitle
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.desktop_sk_hynix_256gb_ssd_health
            icon: "{%- set health = states('sensor.desktop_sk_hynix_256gb_ssd_health') -%}}{{ 'mdi:heart-pulse' if health == 'PASSED' else 'mdi:heart-broken' }}"
            icon_color: "{{ 'green' if states('sensor.desktop_sk_hynix_256gb_ssd_health') == 'PASSED' else 'red' }}"
            primary: "SK hynix 256GB SSD"
            secondary: >-
              {%- set health = states('sensor.desktop_sk_hynix_256gb_ssd_health') -%}
              {%- set wear = states('sensor.desktop_sk_hynix_256gb_ssd_wear_level') -%}
              {%- set temp = states('sensor.desktop_sk_hynix_256gb_ssd_temp') -%}
              {{ health }}{% if wear not in ['unknown', 'unavailable'] %} · {{ wear }}% life{% endif %}{% if temp not in ['unknown', 'unavailable'] %} · {{ temp }}°C{% endif %}
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wd_1tb_hdd_health
            icon: "{%- set health = states('sensor.desktop_wd_1tb_hdd_health') -%}}{{ 'mdi:heart-pulse' if health == 'PASSED' else 'mdi:heart-broken' }}"
            icon_color: "{{ 'green' if states('sensor.desktop_wd_1tb_hdd_health') == 'PASSED' else 'red' }}"
            primary: "WD 1TB HDD"
            secondary: >-
              {%- set health = states('sensor.desktop_wd_1tb_hdd_health') -%}
              {%- set wear = states('sensor.desktop_wd_1tb_hdd_wear_level') -%}
              {%- set temp = states('sensor.desktop_wd_1tb_hdd_temp') -%}
              {{ health }}{% if wear not in ['unknown', 'unavailable'] %} · {{ wear }}% life{% endif %}{% if temp not in ['unknown', 'unavailable'] %} · {{ temp }}°C{% endif %}
            multiline_secondary: true
            tap_action:
              action: more-info

  # WiFi
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: WiFi
        heading_style: subtitle
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wifi_network
            icon: mdi:wifi
            icon_color: blue
            primary: Network
            secondary: "{{ states('sensor.desktop_wifi_network') }}"
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wifi_signal
            icon: "{{ 'mdi:wifi-strength-4' if states('sensor.desktop_wifi_signal') | int > 75 else 'mdi:wifi-strength-3' if states('sensor.desktop_wifi_signal') | int > 50 else 'mdi:wifi-strength-2' if states('sensor.desktop_wifi_signal') | int > 25 else 'mdi:wifi-strength-1' }}"
            icon_color: "{{ 'green' if states('sensor.desktop_wifi_signal') | int > 60 else 'orange' if states('sensor.desktop_wifi_signal') | int > 30 else 'red' }}"
            primary: Signal
            secondary: "{{ states('sensor.desktop_wifi_signal') }}% ({{ states('sensor.desktop_wifi_signal_dbm') }} dBm)"
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wifi_channel
            icon: mdi:access-point
            icon_color: purple
            primary: Channel
            secondary: "{{ states('sensor.desktop_wifi_channel') }}"
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: sensor.desktop_wifi_bitrate
            icon: mdi:speedometer
            icon_color: teal
            primary: Link Speed
            secondary: "{{ states('sensor.desktop_wifi_bitrate') }} Mbps"
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
