title: Vultr
path: vultr
type: sections
max_columns: 2

badges:
  - type: custom:mushroom-template-badge
    entity: sensor.vultr_cpu_utilization
    icon: "{{ state_attr('sensor.ui_vultr_cpu_utilization', 'icon') }}"
    color: "{{ state_attr('sensor.ui_vultr_cpu_utilization', 'color') }}"
    content: "{{ state_attr('sensor.ui_vultr_cpu_utilization', 'short_label') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.vultr_memory_percent
    icon: "{{ state_attr('sensor.ui_vultr_memory_percent', 'icon') }}"
    color: "{{ state_attr('sensor.ui_vultr_memory_percent', 'color') }}"
    content: "{{ state_attr('sensor.ui_vultr_memory_percent', 'short_label') }}"
    tap_action:
      action: more-info

sections:
  # System Status
  - type: grid
    column_span: 2
    cards:
      - type: custom:mushroom-title-card
        title: Vultr
        subtitle: "{{ states('sensor.vultr_overall_status_summary') }}"
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.vultr_uptime_s
            icon: "{{ state_attr('sensor.ui_vultr_uptime_s', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_vultr_uptime_s', 'color') }}"
            primary: Uptime
            secondary: "{{ state_attr('sensor.ui_vultr_uptime_s', 'label_vertical') }}"
            layout: vertical
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: sensor.vultr_updates_pending
            icon: "{{ state_attr('sensor.ui_vultr_updates_pending', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_vultr_updates_pending', 'color') }}"
            primary: Updates
            secondary: "{{ state_attr('sensor.ui_vultr_updates_pending', 'label_vertical') }}"
            layout: vertical
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: binary_sensor.vultr_status_alarm
            icon: "{{ state_attr('sensor.ui_vultr_status_alarm', 'icon') }}"
            icon_color: "{{ state_attr('sensor.ui_vultr_status_alarm', 'color') }}"
            primary: Status
            layout: vertical
            multiline_secondary: true
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
      - type: markdown
        content: >-
          **Available Updates:**

          {%- set packages = state_attr('sensor.vultr_updates_list', 'packages') | default([]) -%}
          {%- for pkg in packages -%}
          - {{ pkg }}
          {{ '' }}
          {%- endfor -%}
        visibility:
          - condition: numeric_state
            entity: sensor.vultr_updates_pending
            above: 0
        card_mod:
          style: |
            ha-card {
              background: rgba(var(--rgb-primary-color), 0.1);
              font-size: 0.9em;
            }

