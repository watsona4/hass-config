title: PurpleAir
path: purpleair
type: sections
max_columns: 2
cards: []
sections:
  - type: grid
    cards:

      # PurpleAir Map Widget (official embeddable widget, hosted locally at
      # /local/purpleair_widget.html -- embedding map.purpleair.com's own page
      # directly doesn't work, it has browser/bot detection that blocks a
      # plain iframe; this widget script is PurpleAir's own sanctioned embed
      # mechanism and isn't subject to that)
      - type: custom:mushroom-title-card
        title: PurpleAir Map

      - type: iframe
        url: /local/purpleair_widget.html
        aspect_ratio: 160%
        grid_options:
          columns: 6
          rows: 6

      # AQI
      - type: custom:mushroom-title-card
        title: Air Quality Index

      - type: custom:modern-circular-gauge
        entity: sensor.purpleair_church_st_aqi
        name: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'name') }}"
        max: 500
        adaptive_state_color: true
        segments:
          - from: 0
            color: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'color_0') }}"
            label: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'label_0') }}"
          - from: 51
            color: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'color_51') }}"
            label: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'label_51') }}"
          - from: 101
            color: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'color_101') }}"
            label: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'label_101') }}"
          - from: 151
            color: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'color_151') }}"
            label: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'label_151') }}"
          - from: 201
            color: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'color_201') }}"
            label: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'label_201') }}"
          - from: 301
            color: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'color_301') }}"
            label: "{{ state_attr('sensor.ui_purpleair_aqi_gauge', 'label_301') }}"
        secondary:
          unit: AQI
          show_gauge: none
          entity: sensor.purpleair_church_st_aqi
        gauge_foreground_style:
          width: 10
        needle: true
        grid_options:
          columns: 12
          rows: 4
        tertiary: {}

      - type: custom:mushroom-template-card
        entity: sensor.purpleair_church_st_aqi
        icon: "{{ state_attr('sensor.ui_purpleair_aqi', 'icon') }}"
        primary: Health Advice
        secondary: "{{ state_attr('sensor.ui_purpleair_aqi', 'label') }}"
        multiline_secondary: true
        icon_color: "{{ state_attr('sensor.ui_purpleair_aqi', 'color') }}"
        grid_options:
          columns: full
          rows: 2
        tap_action:
          action: more-info

      # Mass Concentrations
      - type: custom:mushroom-title-card
        title: Mass Concentrations

      - type: grid
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.church_st_pm1
            primary: PM1.0
            icon: mdi:blur
            secondary: "{{ state_attr('sensor.ui_purpleair_pm1', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_pm1', 'color') }}"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.church_st_pm2_5
            primary: PM2.5
            icon: mdi:blur
            secondary: "{{ state_attr('sensor.ui_purpleair_pm2_5', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_pm2_5', 'color') }}"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.church_st_pm10
            primary: PM10
            icon: mdi:blur-radial
            secondary: "{{ state_attr('sensor.ui_purpleair_pm10', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_pm10', 'color') }}"
            tap_action:
              action: more-info

      # Particle Counts (no severity scale exists for these -- raw values only)
      - type: custom:mushroom-title-card
        title: Particle Counts

      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            entity: sensor.church_st_pm0_3_count_concentration
            icon: mdi:atom
            content: "{{ states('sensor.church_st_pm0_3_count_concentration') }}"
            tap_action:
              action: more-info
          - type: template
            entity: sensor.church_st_pm0_5_count_concentration
            icon: mdi:atom
            content: "{{ states('sensor.church_st_pm0_5_count_concentration') }}"
            tap_action:
              action: more-info
          - type: template
            entity: sensor.church_st_pm1_0_count_concentration
            icon: mdi:atom
            content: "{{ states('sensor.church_st_pm1_0_count_concentration') }}"
            tap_action:
              action: more-info
          - type: template
            entity: sensor.church_st_pm2_5_count_concentration
            icon: mdi:atom
            content: "{{ states('sensor.church_st_pm2_5_count_concentration') }}"
            tap_action:
              action: more-info
          - type: template
            entity: sensor.church_st_pm5_0_count_concentration
            icon: mdi:atom
            content: "{{ states('sensor.church_st_pm5_0_count_concentration') }}"
            tap_action:
              action: more-info
          - type: template
            entity: sensor.church_st_pm10_0_count_concentration
            icon: mdi:atom
            content: "{{ states('sensor.church_st_pm10_0_count_concentration') }}"
            tap_action:
              action: more-info

      # Environmental Readings
      - type: custom:mushroom-title-card
        title: Environmental Readings

      - type: grid
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.church_st_temperature
            primary: Temp
            icon: "{{ state_attr('sensor.ui_purpleair_temperature', 'icon') }}"
            secondary: "{{ state_attr('sensor.ui_purpleair_temperature', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_temperature', 'color') }}"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.church_st_humidity
            primary: Humidity
            icon: "{{ state_attr('sensor.ui_purpleair_humidity', 'icon') }}"
            secondary: "{{ state_attr('sensor.ui_purpleair_humidity', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_humidity', 'color') }}"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.church_st_pressure
            primary: Pressure
            icon: "{{ state_attr('sensor.ui_purpleair_pressure', 'icon') }}"
            secondary: "{{ state_attr('sensor.ui_purpleair_pressure', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_pressure', 'color') }}"
            tap_action:
              action: more-info

      # Device Health
      - type: custom:mushroom-title-card
        title: Device Health

      - type: grid
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.church_st_volatile_organic_compounds_air_quality_index
            primary: VOC AQI
            icon: "{{ state_attr('sensor.ui_purpleair_voc_aqi', 'icon') }}"
            secondary: "{{ state_attr('sensor.ui_purpleair_voc_aqi', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_voc_aqi', 'color') }}"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.church_st_rssi
            primary: Signal
            icon: "{{ state_attr('sensor.ui_purpleair_rssi', 'icon') }}"
            secondary: "{{ state_attr('sensor.ui_purpleair_rssi', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_rssi', 'color') }}"
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            entity: sensor.church_st_uptime
            primary: Uptime
            icon: "{{ state_attr('sensor.ui_purpleair_uptime', 'icon') }}"
            secondary: "{{ state_attr('sensor.ui_purpleair_uptime', 'label') }}"
            icon_color: "{{ state_attr('sensor.ui_purpleair_uptime', 'color') }}"
            tap_action:
              action: more-info
