# -----------------------------------------------------------------------------
# Environment Dashboard: Plants View
# -----------------------------------------------------------------------------
#
# Displays plant care status with per-plant sections dynamically switched
# via input_select. All dynamic values use state_attr() lookups on ui_*
# sensors - no inline Jinja templates.
#
# -----------------------------------------------------------------------------

type: sections
max_columns: 2
title: Plants
path: plants

# -----------------------------------------------------------------------------
# Badges: All use state_attr() lookups on ui_* sensors
# -----------------------------------------------------------------------------
badges:
  - type: custom:mushroom-template-badge
    entity: sensor.plants_location
    icon: "{{ state_attr('sensor.ui_plants_location_badge', 'icon') }}"
    color: "{{ state_attr('sensor.ui_plants_location_badge', 'color') }}"
    content: "{{ state_attr('sensor.ui_plants_location_badge', 'content') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.plants_location_reason
    icon: "{{ state_attr('sensor.ui_plants_location_reason_badge', 'icon') }}"
    color: "{{ state_attr('sensor.ui_plants_location_reason_badge', 'color') }}"
    content: "{{ state_attr('sensor.ui_plants_location_reason_badge', 'content') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: sensor.plants_location_changed
    icon: "{{ state_attr('sensor.ui_plants_location_changed_badge', 'icon') }}"
    color: "{{ state_attr('sensor.ui_plants_location_changed_badge', 'color') }}"
    content: "{{ state_attr('sensor.ui_plants_location_changed_badge', 'content') }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-badge
    entity: input_select.plant_sensor_location
    icon: "{{ state_attr('sensor.ui_plant_sensor_location_badge', 'icon') }}"
    color: "{{ state_attr('sensor.ui_plant_sensor_location_badge', 'color') }}"
    content: "{{ state_attr('sensor.ui_plant_sensor_location_badge', 'content') }}"
    tap_action:
      action: more-info

# -----------------------------------------------------------------------------
# Sections: Plant cards switched via state-switch
# -----------------------------------------------------------------------------
sections:
  - type: grid
    column_span: 2
    cards:
      - type: custom:state-switch
        entity: input_select.plant_sensor_location
        default: ficus religiosa
        transition: slide-left
        grid_options:
          columns: full
        states:
          "ficus religiosa": !include ../plant_sections/ficus_religiosa_section.yaml
          "haworthia fasciata": !include ../plant_sections/haworthia_fasciata_section.yaml
          "hedera helix": !include ../plant_sections/hedera_helix_section.yaml
