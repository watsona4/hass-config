  source: sensor.both_humidity_d1f2020f4a37
  unit_time: s
  time_window: "0:05:00"

- platform: derivative
  name: "Gym Humidity Second Derivative"
  source: sensor.gym_humidity_first_derivative
  unit_time: s
  time_window: "0:05:00"

