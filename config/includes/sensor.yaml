- platform: mold_indicator
  name: "Mold Indicator"
  unique_id: mold_indicator
  indoor_temp_sensor: sensor.dehumidifier_temperature
  indoor_humidity_sensor: sensor.dehumidifier_humidity
  outdoor_temp_sensor: sensor.outside_temperature_filtered
  calibration_factor: 1.17777777777777

# High/Low Temperature (today + all-time) moved to trigger-based template
# sensors in includes/template.yaml — recorder-free, persist across restarts.

- platform: statistics
  name: "Wind Gust Max 10m"
  unique_id: 2e11cb6c-ce79-47fb-ab11-17d420eb94a1
  entity_id: sensor.openmeteo_home_wind_gust
  state_characteristic: value_max
  max_age:
    minutes: 10

- platform: statistics
  name: "Wind Speed Mean 5m"
  unique_id: 59b765c8-0053-4d47-ab43-77d6ee573f6e
  entity_id: sensor.openmeteo_home_wind_speed
  state_characteristic: mean
  max_age:
    minutes: 5

# Rolling 20-min peak of station solar radiation. Feeds binary_sensor.sunny:
# the tree-shaded pyranometer only sees direct sun as brief high spikes through
# canopy gaps, so the recent max is a far better "sun is out" signal than the
# instantaneous value. sampling_size covers ~20 one-per-minute samples + margin.
- platform: statistics
  name: "Solar Radiation Max 20m"
  unique_id: solar_radiation_max_20m
  entity_id: sensor.ambient_solarradiation
  state_characteristic: value_max
  max_age:
    minutes: 20
  sampling_size: 60

# Rolling 1-hour mean of outdoor PM2.5 -> feeds binary_sensor.smoky. Smooths the
# spiky raw reading so wildfire-smoke detection doesn't flicker.
- platform: statistics
  name: "Outdoor PM2.5 Mean 1h"
  unique_id: outdoor_pm25_mean_1h
  entity_id: sensor.ambient_pm25
  state_characteristic: mean
  max_age:
    minutes: 60
  sampling_size: 120

- platform: rest
  name: "Agromonitoring"
  unique_id: agromonitoring
  scan_interval: 43200
  timeout: 8
  resource: https://api.agromonitoring.com/agro/1.0/soil
  params:
    polyid: !secret agromonitoring_polyid
    appid: !secret agromonitoring_appid
  headers:
    Accept: application/json
    User-Agent: HomeAssistant
    Cache-Control: no-cache
  value_template: >-
    {% set dt = value_json.get('dt') if value_json is mapping else none %}
    {{ dt if dt is not none else states(this.entity_id) }}
  json_attributes:
    - dt
    - t10
    - moisture
    - t0
