# ===============================
# Presence delays
# ===============================
- binary_sensor:
    - name: Eleanor Presence Delay
      unique_id: eleanor_presence_delay
      device_class: presence
      delay_off: "01:00:00"
      availability: "{{ has_value('binary_sensor.eleanor_presence_presence_information') }}"
      state: "{{ is_state('binary_sensor.eleanor_presence_presence_information','on') }}"

    - name: Michael Presence Delay
      unique_id: michael_presence_delay
      device_class: presence
      delay_off: "01:00:00"
      availability: "{{ has_value('binary_sensor.michael_presence_presence_information') }}"
      state: "{{ is_state('binary_sensor.michael_presence_presence_information','on') }}"

    - name: Guest Bedroom Presence Delay
      unique_id: guest_bedroom_presence_delay
      device_class: presence
      delay_off: "01:00:00"
      availability: "{{ has_value('binary_sensor.guest_bedroom_presence_presence_sensor_1') }}"
      state: "{{ is_state('binary_sensor.guest_bedroom_presence_presence_sensor_1','on') }}"

# ===============================
# Dehumidifier with power attribute
# ===============================
- binary_sensor:
    - name: Living Room Dehumidifier
      unique_id: living_room_dehumidifier
      device_class: running
      availability: "{{ has_value('switch.living_room_dehumidifier') and has_value('sensor.living_room_dehumidifier_power') }}"
      state: "{{ is_state('switch.living_room_dehumidifier','on') }}"
      attributes:
        power: "{{ states('sensor.living_room_dehumidifier_power') | float(0) }}"

# ===============================
# Sensor Problems
# ===============================
- trigger:
    - platform: time_pattern
      hours: "/3"
  variables:
    problem_list: >-
      {% set sensors = [
        "sensor.acurite_tower_a_11075_temperature",
        "sensor.ambient_sensor_1_temperature",
        "sensor.water_barrel_fill_level",
        "light.chicken_coop_light",
        "sensor.outside_brightness",
        "sensor.ambient_illuminance",
        "binary_sensor.rain_sensor_moisture",
      ] %}
      {% set ns = namespace(data=[]) %}
      {% for s in sensors %}
        {% if not has_value(s) %}
          {% set ns.data = ns.data + [s] %}
        {% endif %}
      {% endfor %}
      {{ ns.data }}
  binary_sensor:
    - name: Sensor Problems
      unique_id: sensor_problems
      device_class: problem
      state: "{{ 'on' if problem_list | count > 0 else 'off' }}"
      attributes:
        problems: "{{ problem_list }}"

# ===============================
# Dark Outside
# ===============================
- binary_sensor:
    - name: Dark Outside
      unique_id: dark_outside
      availability: "{{ has_value('sensor.ambient_illuminance') }}"
      delay_off: "00:05:00"
      state: >-
        {% set ill = states('sensor.ambient_illuminance') | float(default=none) %}
        {% if ill is not none %}
          {% set was_dark = is_state('binary_sensor.dark_outside', 'on') %}
          {{ ill < 260 or (was_dark and ill < 1350) }}
        {% else %}
          false
        {% endif %}

# ===============================
# Kinda Dark Outside
# ===============================
- binary_sensor:
    - name: Darkish Outside
      unique_id: darkish_outside
      availability: "{{ has_value('sensor.ambient_illuminance') }}"
      delay_off: "00:05:00"
      state: >-
        {{ states('sensor.ambient_illuminance') | float(0) < 2000 }}

# ===============================
# Rain probe “fresh” pulse (triggered)
# ===============================
- trigger:
    - platform: state
      entity_id: binary_sensor.rain_sensor_moisture
  binary_sensor:
    - name: Rain Probe Fresh
      unique_id: rain_probe_fresh
      icon: mdi:timer-sand
      device_class: connectivity
      availability: "{{ has_value('binary_sensor.rain_sensor_moisture') }}"
      state: "{{ trigger.platform == 'state' }}"
      delay_off: "00:30:00"

# ===============================
# Rainy (non-triggered; uses pulse + weather/sunny)
# ===============================
- binary_sensor:
    - name: Rainy
      unique_id: rainy
      device_class: moisture
      icon: "{{ 'mdi:weather-pouring' if is_state(this.entity_id,'on') else 'mdi:weather-partly-cloudy' }}"
      availability: >-
        {{ has_value('binary_sensor.rain_sensor_moisture')
           or has_value('sensor.ambient_hourly_rain') }}
      state: >-
        {# Supplement the unreliable roof rain probe with the Ambient rain-gauge
           rate: rainy if EITHER the (fresh) probe is wet OR the gauge shows rain,
           so rain the roof probe misses is still caught. #}
        {% set probe_wet = has_value('binary_sensor.rain_sensor_moisture')
                           and is_state('binary_sensor.rain_probe_fresh','on')
                           and is_state('binary_sensor.rain_sensor_moisture','on') %}
        {% set gauge_wet = has_value('sensor.ambient_hourly_rain')
                           and (states('sensor.ambient_hourly_rain') | float(0) > 0) %}
        {{ probe_wet or gauge_wet }}
      delay_on: "00:00:30"
      delay_off: "00:05:00"
      attributes:
        source_used: >-
          {% set probe_wet = has_value('binary_sensor.rain_sensor_moisture')
                             and is_state('binary_sensor.rain_probe_fresh','on')
                             and is_state('binary_sensor.rain_sensor_moisture','on') %}
          {% set gauge_wet = has_value('sensor.ambient_hourly_rain')
                             and (states('sensor.ambient_hourly_rain') | float(0) > 0) %}
          {{ 'roof+gauge' if (probe_wet and gauge_wet) else 'roof' if probe_wet
             else 'gauge' if gauge_wet else 'dry' }}
        rain_rate_in_hr: "{{ states('sensor.ambient_hourly_rain') | float(0) }}"
        probe_last_changed: >-
          {% if states.binary_sensor.rain_sensor_moisture is defined %}
            {{ states.binary_sensor.rain_sensor_moisture.last_changed }}
          {% else %} none {% endif %}
        weather_state: "{{ states('weather.forecast_home') }}"

# ===============================
# Snowy (uses OpenMeteo weather state since rain sensor unreliable for snow)
# ===============================
- binary_sensor:
    - name: Snowy
      unique_id: snowy
      icon: "{{ 'mdi:weather-snowy-heavy' if is_state(this.entity_id,'on') else 'mdi:weather-partly-cloudy' }}"
      availability: "{{ has_value('weather.openmeteo_weather_home') }}"
      state: >-
        {% set snowy_states = ['snowy','snowy-heavy','snowy-rainy'] %}
        {{ states('weather.openmeteo_weather_home') in snowy_states }}
      delay_on: "00:00:30"
      delay_off: "00:05:00"
      attributes:
        weather_state: "{{ states('weather.openmeteo_weather_home') }}"

- sensor:
    - name: Open Doors & Windows
      unique_id: open_doors_windows
      icon: mdi:door
      state: >
        {# List the friendly names, comma-separated, or "None" #}
        {% set open = states.binary_sensor
            | selectattr('attributes.device_class','in',['door','window'])
            | selectattr('state','eq','on')
            | sort(attribute='name') | list %}
        {% if open | count == 0 %}All closed
        {% else %}{{ open | map(attribute='name') | list | join(', ') }}{% endif %}
      attributes:
        count: >
          {% set open = states.binary_sensor
              | selectattr('attributes.device_class','in',['door','window'])
              | selectattr('state','eq','on') | list %}
          {{ open | count }}
        names: >
          {% set open = states.binary_sensor
              | selectattr('attributes.device_class','in',['door','window'])
              | selectattr('state','eq','on')
              | sort(attribute='name') | list %}
          {{ open | map(attribute='name') | list }}
        entity_ids: >
          {% set open = states.binary_sensor
              | selectattr('attributes.device_class','in',['door','window'])
              | selectattr('state','eq','on')
              | sort(attribute='name') | list %}
          {{ open | map(attribute='entity_id') | list }}

# ===================== Composite Location (Pixel + Work iPhone) =====================
# Put in a package or templates dir. Adjust entity ids at top.
- trigger:
    - platform: state
      entity_id:
        - device_tracker.pixel_9_pro_xl
        - device_tracker.aaron_work_phone
    - platform: homeassistant
      event: start
  variables:
    ent_pixel: device_tracker.pixel_9_pro_xl
    ent_iphone: device_tracker.aaron_work_phone
    pixel: >-
      {%- set s   = states(ent_pixel) -%}
      {%- set lat = state_attr(ent_pixel,'latitude') -%}
      {%- set lon = state_attr(ent_pixel,'longitude') -%}
      {%- set acc = state_attr(ent_pixel,'gps_accuracy') -%}
      {%- set ts  = (states[ent_pixel].last_updated | as_timestamp) -%}
      {%- set age_m = ((now()|as_timestamp) - ts) / 60 if ts else 9e9 -%}
      {# A tracker that stops reporting (phone off, no signal) keeps its last state
         string -- e.g. "not_home" -- forever; it doesn't flip to unavailable. Without
         a staleness ceiling here, "valid" stays true indefinitely and a days-old
         reading can still out-score (or get picked over) a live one. #}
      {%- set valid = (s not in ['unknown','unavailable'])
                      and ((lat|float(none)) is not none)
                      and ((lon|float(none)) is not none)
                      and ((acc|float(none)) is not none)
                      and ((lat|float(0)) != 0 or (lon|float(0)) != 0)
                      and (age_m < 90) -%}
      {%- set acc_f = acc | float(9999) -%}
      {%- set score = (
            (50 if valid else 0) +
            (max(0, 30 - min(30, age_m))) +
            (max(0, 20 - min(20, (acc_f / 2))))
          ) -%}
      {{ {'entity': ent_pixel, 'state': s, 'lat': (lat|float(none)), 'lon': (lon|float(none)),
          'acc': (acc|float(none)), 'age_m': age_m, 'valid': valid, 'score': score} }}
    iphone: >-
      {%- set s   = states(ent_iphone) -%}
      {%- set lat = state_attr(ent_iphone,'latitude') -%}
      {%- set lon = state_attr(ent_iphone,'longitude') -%}
      {%- set acc = state_attr(ent_iphone,'gps_accuracy') -%}
      {%- set ts  = (states[ent_iphone].last_updated | as_timestamp) -%}
      {%- set age_m = ((now()|as_timestamp) - ts) / 60 if ts else 9e9 -%}
      {%- set valid = (s not in ['unknown','unavailable'])
                      and ((lat|float(none)) is not none)
                      and ((lon|float(none)) is not none)
                      and ((acc|float(none)) is not none)
                      and ((lat|float(0)) != 0 or (lon|float(0)) != 0)
                      and (age_m < 90) -%}
      {%- set acc_f = acc | float(9999) -%}
      {%- set score = (
            (50 if valid else 0) +
            (max(0, 30 - min(30, age_m))) +
            (max(0, 20 - min(20, (acc_f / 2))))
          ) -%}
      {{ {'entity': ent_iphone, 'state': s, 'lat': (lat|float(none)), 'lon': (lon|float(none)),
          'acc': (acc|float(none)), 'age_m': age_m, 'valid': valid, 'score': score} }}
    # The work phone lives at the house and isn't carried while traveling, so when
    # the personal phone (pixel) goes unavailable, falling back to the work phone's
    # GPS reports "home" regardless of where the person actually is. Instead, hold
    # at this sensor's own last computed value (i.e. the personal phone's last real
    # position before it went dark) rather than trusting the work phone's location.
    frozen: >-
      {%- set prev_lat = state_attr('sensor.aaron_composite_location','latitude') -%}
      {%- set prev_lon = state_attr('sensor.aaron_composite_location','longitude') -%}
      {{ {'entity': state_attr('sensor.aaron_composite_location','source_entity'),
          'state': states('sensor.aaron_composite_location'),
          'lat': prev_lat, 'lon': prev_lon,
          'acc': state_attr('sensor.aaron_composite_location','gps_accuracy'),
          'age_m': 9e9, 'valid': (prev_lat is not none and prev_lon is not none), 'score': 0} }}
    # Neither phone travels with Aaron all the time: the work phone stays home/in the
    # car during the workday (personal phone is with him at the office, zone.bettis),
    # and the work phone stays home while personal travels (vacation). A "higher score
    # wins" contest is wrong either way -- a phone sitting still at the house always has
    # a cleaner GPS lock than a phone actually out with him, regardless of which one that
    # is. What carries information is whichever phone is NOT at the house: a phone that
    # reads "home" tells you nothing (it may just have been left behind), so whenever
    # exactly one of the two disagrees with "home", trust the one that disagrees. When
    # BOTH disagree with "home" at once (e.g. personal phone in the work parking lot
    # while the work phone is on him inside), that's the office pattern far more often
    # than a coincidence -- unless vacation_mode says he's actually traveling, in which
    # case personal is the one with him.
    best: >-
      {%- if pixel.valid and iphone.valid -%}
        {%- if is_state(ent_pixel,'home') and not is_state(ent_iphone,'home') -%}
          {{ iphone }}
        {%- elif is_state(ent_iphone,'home') and not is_state(ent_pixel,'home') -%}
          {{ pixel }}
        {%- elif is_state('binary_sensor.vacation_mode','on') -%}
          {{ pixel }}
        {%- else -%}
          {{ iphone }}
        {%- endif -%}
      {%- elif pixel.valid -%}
        {{ pixel }}
      {%- elif iphone.valid and frozen.valid -%}
        {{ frozen }}
      {%- elif iphone.valid -%}
        {{ iphone }}
      {%- else -%}
        {{ {'entity': none, 'state': 'unknown', 'lat': none, 'lon': none,
            'acc': none, 'age_m': 9e9, 'valid': false, 'score': 0} }}
      {%- endif -%}

  sensor:
    - name: Aaron Composite Location
      unique_id: aaron_composite_location
      icon: mdi:account
      availability: "{{ best.valid }}"
      state: "{{ best.state if best.state is string else 'unknown' }}"
      attributes:
        source_entity: "{{ best.entity }}"
        latitude: "{{ best.lat }}"
        longitude: "{{ best.lon }}"
        gps_accuracy: "{{ best.acc }}"
        age_minutes: "{{ (best.age_m | float(0) | round(1)) if (best.age_m|float(none)) is not none else none }}"
        pixel_score: "{{ pixel.score }}"
        iphone_score: "{{ iphone.score }}"

# =============================================================================
# Outdoor temperature high/low records (recorder-free; replaces the statistics
# platform sensors that reloaded ~30 days of history at every startup).
# Trigger-based template sensors restore their last state across restarts, so
# they need zero recorder reads and the all-time records persist indefinitely.
#   - sensor.high_temperature / low_temperature      : today's, reset at midnight
#   - sensor.high_temperature_all_time / *_all_time  : persist forever
# Source: sensor.outside_temperature_filtered. All-time seeded with the prior
# records (high 94.1 / low 40.82) captured 2026-06-30.
# =============================================================================
- trigger:
    - platform: state
      entity_id: sensor.outside_temperature_filtered
    - platform: time
      at: "00:00:00"
    - platform: homeassistant
      event: start
  sensor:
    - name: "High Temperature"
      unique_id: high_temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°F"
      state: >-
        {% set cur = states('sensor.outside_temperature_filtered') | float(none) %}
        {% if trigger is not none and trigger.platform == 'time' %}
          {{ cur if cur is not none else this.state }}
        {% elif cur is none %}
          {{ this.state }}
        {% else %}
          {{ [cur, this.state | float(cur)] | max }}
        {% endif %}

    - name: "Low Temperature"
      unique_id: low_temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°F"
      state: >-
        {% set cur = states('sensor.outside_temperature_filtered') | float(none) %}
        {% if trigger is not none and trigger.platform == 'time' %}
          {{ cur if cur is not none else this.state }}
        {% elif cur is none %}
          {{ this.state }}
        {% else %}
          {{ [cur, this.state | float(cur)] | min }}
        {% endif %}

- trigger:
    - platform: state
      entity_id: sensor.outside_temperature_filtered
    - platform: homeassistant
      event: start
  sensor:
    - name: "High Temperature All Time"
      unique_id: high_temperature_all_time
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°F"
      state: >-
        {% set cur = states('sensor.outside_temperature_filtered') | float(none) %}
        {% if cur is none %}
          {{ this.state }}
        {% else %}
          {{ [cur, this.state | float(94.1)] | max }}
        {% endif %}

    - name: "Low Temperature All Time"
      unique_id: low_temperature_all_time
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°F"
      state: >-
        {% set cur = states('sensor.outside_temperature_filtered') | float(none) %}
        {% if cur is none %}
          {{ this.state }}
        {% else %}
          {{ [cur, this.state | float(40.82)] | min }}
        {% endif %}


# =============================================================================
# Kitchen Door Lock Status — mirrors sensor.garage_door_status (see
# packages/garage_door_status.yaml): state reflects the raw
# lock.ultraloq_bolt_f_matter state, with icon/color/reason attributes for
# dashboard use. reason re-derives *why* the lock is in its current state from
# the same condition inputs the "Kitchen Door Lock" automation itself uses
# (auto-lock/unlock based on presence, daytime, dark-outside) -- it doesn't
# read anything the automation writes, it independently recomputes the same
# logic, exactly like the garage door sensor does. Formerly "Side Door Lock
# Status" (lock.side_door, a U-tec/Ultraloq lock bridged via SmartThings
# cloud-to-cloud) -- replaced 2026-08-14 with the same physical lock
# reconfigured to speak Matter/Thread directly, fixing the recurring
# SmartThings link staleness. See [[matter-thread-crossvlan-fix]] and
# [[side-door-lock-connectivity]] in memory for the full history.
# =============================================================================
- trigger:
    - platform: state
      entity_id:
        - lock.ultraloq_bolt_f_matter
        - input_boolean.someone_is_home
        - input_boolean.home_alone
        - binary_sensor.daytime
        - binary_sensor.dark_outside
    - platform: homeassistant
      event: start
  sensor:
    - name: "Kitchen Door Lock Status"
      unique_id: kitchen_door_lock_status
      state: "{{ states('lock.ultraloq_bolt_f_matter') }}"
      attributes:
        online: "{{ has_value('lock.ultraloq_bolt_f_matter') }}"
        reason: >-
          {%- set someone_home = is_state('input_boolean.someone_is_home', 'on') -%}
          {%- set home_alone = is_state('input_boolean.home_alone', 'on') -%}
          {%- set daytime = is_state('binary_sensor.daytime', 'on') -%}
          {%- set dark_outside = is_state('binary_sensor.dark_outside', 'on') -%}
          {%- set good_conditions = daytime and not dark_outside and someone_home and not home_alone -%}
          {%- if is_state('lock.ultraloq_bolt_f_matter', 'locked') -%}
            {%- if not someone_home -%}
              No one home
            {%- elif home_alone -%}
              Home alone mode
            {%- elif not daytime -%}
              Nighttime
            {%- elif dark_outside -%}
              Dark outside
            {%- else -%}
              Manually locked
            {%- endif -%}
          {%- elif is_state('lock.ultraloq_bolt_f_matter', 'unlocked') -%}
            {%- if good_conditions -%}
              Good conditions
            {%- else -%}
              Manually unlocked
            {%- endif -%}
          {%- else -%}
            Unknown
          {%- endif -%}
        icon: >-
          {%- if is_state('lock.ultraloq_bolt_f_matter', 'locked') -%}
            mdi:lock
          {%- elif is_state('lock.ultraloq_bolt_f_matter', 'unlocked') -%}
            mdi:lock-open-variant
          {%- elif is_state('lock.ultraloq_bolt_f_matter', 'jammed') -%}
            mdi:lock-alert
          {%- elif has_value('lock.ultraloq_bolt_f_matter') -%}
            mdi:lock-question
          {%- else -%}
            mdi:lock-alert-outline
          {%- endif -%}
        color: >-
          {%- if is_state('lock.ultraloq_bolt_f_matter', 'locked') -%}
            green
          {%- elif is_state('lock.ultraloq_bolt_f_matter', 'unlocked') -%}
            blue
          {%- elif is_state('lock.ultraloq_bolt_f_matter', 'jammed') -%}
            red
          {%- elif has_value('lock.ultraloq_bolt_f_matter') -%}
            amber
          {%- else -%}
            red
          {%- endif -%}
