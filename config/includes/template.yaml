# ===============================
# RV connectivity pulse
# ===============================
- binary_sensor:
    - name: RV Online
      unique_id: rv_online
      device_class: connectivity
      availability: "{{ has_value('sensor.rv_last_seen') }}"
      state: "{{ has_value('sensor.rv_last_seen') }}"
      delay_off: "00:02:00"

# ===============================
# Sunny outside (debounced)
#
# The Ambient station is heavily tree-shaded to the E/SE, so direct sun only
# reaches the pyranometer once it clears the canopy (~10am) and again in the
# open western sky (~2-4pm). A fixed illuminance threshold therefore read "not
# sunny" all morning even on clear days. Instead we detect direct sun by its
# signature: the beam punching through canopy gaps spikes solar radiation well
# past any overcast value. sensor.solar_radiation_max_20m is a rolling 20-min
# max; a peak >= 300 W/m2 means the sun is genuinely out. Calibrated from the
# clear day 2026-07-11 (dappled spikes 700-1190 W/m2 vs flat <=250 when blocked)
# and the 2026-07-14 bright-overcast reference (peaked at only 136 W/m2) -- 300
# stays comfortably above both non-sunny ceilings. Lowered from 400 on
# 2026-07-17 after a low-sun-angle (~28 deg elevation) late-afternoon reading of
# 340 W/m2 read as "not sunny" despite visibly direct sun -- 400 had no margin
# left for weaker, lower-elevation spikes. Note: while the sun is fully behind
# the trees the station has no signal, so this will read "off" during those
# hours regardless of sky clarity.
#
# Smoke branch: wildfire smoke scatters the beam so it never spikes even on a
# cloudless day. When binary_sensor.smoky is on we relax the requirement to a
# low daylight floor (peak >= 50) so a smoky-but-clear day still reads sunny.
# Assumes smoke => otherwise-clear sky (typical of high-pressure smoke events);
# a smoky AND genuinely cloudy day would false-positive - see the calibration
# doc (config/docs/sunny-sensor-calibration.md) to refine once such a day is
# labeled.
#
# Steeple branch (added 2026-07-19): separate from the tree obstruction above,
# a church steeple blocks the station's own pyranometer in a specific sky
# window. Derived from 21 days of sensor.solar_radiation_max_20m recorder
# history binned by (azimuth, elevation): holding elevation fixed, radiation
# craters from 190-330 W/m2 down to 63-66 W/m2 between azimuth 278 and 282 at
# elevation 15-25 deg, and is similarly suppressed (150-270 vs 322-693 W/m2 at
# comparable azimuths one elevation band up) across azimuth 266-276 at
# elevation 25-35 deg -- narrowing to no detectable effect by elevation 35-45.
# That wide-at-the-base/narrow-at-the-top shape matches a spire's silhouette.
# Cross-checked against sensor.living_room_{left,right}_window_light_level
# (a different vantage, unaffected by this specific obstruction) over the same
# azimuth range: it shows only the smooth, expected evening decline with no
# comparable dip, confirming this is a station-specific artifact and not the
# sun genuinely dimming. Owner decision: while in this zone, hold the sensor's
# last computed value rather than trusting the (locally invalid) radiation
# reading -- simplest option, no new sensor dependency. Zone: azimuth 264-286,
# elevation < 30. Re-derive if the steeple's angular position relative to the
# station ever changes (station moved, tree growth alters the sightline, etc).
# ===============================
- binary_sensor:
    - name: Sunny
      unique_id: sunny_outside
      device_class: light
      delay_on: "00:02:00"
      delay_off: "00:05:00"
      availability: >-
        {{ has_value('sensor.solar_radiation_max_20m')
           and has_value('sensor.ambient_solarradiation') }}
      state: >-
        {% set elev = state_attr('sun.sun','elevation') | float(0) %}
        {% set azi = state_attr('sun.sun','azimuth') | float(0) %}
        {% set peak = states('sensor.solar_radiation_max_20m') | float(0) %}
        {% set smoky = is_state('binary_sensor.smoky', 'on') %}
        {% set steeple = azi >= 264 and azi < 286 and elev < 30 %}
        {{ (this.state == 'on') if steeple
           else (elev > 3 and (peak >= 300 or (smoky and peak >= 50))) }}

# ===============================
# Smoky outside (wildfire haze)
#
# Wildfire smoke is a recurring summer pattern here and is optically distinct
# from cloud: it scatters the direct beam (so the pyranometer reads low, like a
# cloudy day) but shows up clearly in PM2.5. Threshold 35 ug/m3 (1h mean) sits
# well above clear/cloudy-day PM2.5 (avg 6-13, peak <=30 on 2026-07-11..14) and
# below the 2026-07-15 smoke event (avg 41, peak 93). Consumed by
# binary_sensor.sunny to relax the direct-beam requirement on smoky-clear days.
# ===============================
- binary_sensor:
    - name: Smoky
      unique_id: smoky_outside
      delay_on: "00:10:00"
      delay_off: "00:20:00"
      availability: "{{ has_value('sensor.outdoor_pm25_mean_1h') }}"
      state: "{{ states('sensor.outdoor_pm25_mean_1h') | float(0) > 35 }}"

# ===============================
# Windy outside
# ===============================
- binary_sensor:
    - name: Windy
      unique_id: 09f555b3-446b-4f32-8641-62c95e9669a6
      state: >
        {% set gust_max = states('sensor.wind_gust_max_10m') | float(0) %}
        {% set mean_5m  = states('sensor.wind_speed_mean_5m') | float(0) %}
        {% set wind_dir = states('sensor.ambient_wind_direction_avg_10m') | float(0) %}
        {% set door_dir = states('input_number.garage_azimuth') | float(180) %}
        {% set angle = (((wind_dir - door_dir + 180) % 360 - 180) | abs) %}
        {% set aligned = angle <= 60 %}
        {# Require sustained wind (mean_5m) together with the gust, not either alone -
           a single brief 10-min-max gust with no real sustained wind behind it (like
           the 16.33 mph blip on 2026-07-03, mean_5m never exceeded 9.84) shouldn't
           count as "windy" for the purpose of blowing leaves/debris into the garage. #}
        {% set on_cond  = mean_5m >= 12 and gust_max >= 16 %}
        {% set off_cond = gust_max < 12 and mean_5m < 9 %}
        {% if this.state == 'on' %}
          {{ aligned and not off_cond }}
        {% else %}
          {{ aligned and on_cond }}
        {% endif %}
      delay_on: "00:02:00"
      delay_off: "00:10:00"
      icon: "{{ 'mdi:leaf-off' if is_state(this.entity_id,'on') else 'mdi:leaf' }}"

# =================
# Daytime/Evening
# =================
- trigger:
    - platform: state
      entity_id:
        - input_boolean.daytime_override
        - calendar.holidays_in_united_states
    - platform: time_pattern
      minutes: "/1"

  variables:
    now_dt: "{{ now() }}"
    override_on: "{{ is_state('input_boolean.daytime_override', 'on') }}"

    anchor_offset: "{{ -1 if now_dt|as_datetime < today_at('02:00:00') else 0 }}"
    anchor_dt: "{{ now_dt|as_datetime + timedelta(days=anchor_offset) }}"
    is_weekend: "{{ (anchor_dt|as_datetime).weekday() >= 5 }}"
    is_weekday: "{{ not is_weekend|bool }}"

    raw_msg: "{{ state_attr('calendar.holidays_in_united_states', 'message') or '' }}"
    holiday_name: "{{ raw_msg | regex_replace('\\s*\\([^)]*\\)\\s*$', '') | trim | replace('Day','Eve' if anchor_offset == -1 else 'Day') }}"

    off_day_holidays:
      - "New Year's Day"
      - "Martin Luther King Jr. Day"
      - "Presidents' Day"
      - "Memorial Day"
      - "Juneteenth"
      - "Independence Day"
      - "Labor Day"
      - "Columbus Day"
      - "Halloween"
      - "Veterans Day"
      - "Thanksgiving Day"
      - "Black Friday"
      - "Christmas Eve"
      - "Christmas Day"
      - "New Year's Eve"

    calendar_on: "{{ is_state('calendar.holidays_in_united_states', 'on') }}"
    is_holiday: "{{ calendar_on and (holiday_name in off_day_holidays) }}"

    default_day_start: "05:00"
    weekend_day_start: "06:30"
    holiday_day_start: "06:30"

    default_day_end: "20:30"
    weekend_day_end: "20:30"
    holiday_day_end: "20:30"

    default_eve_duration: 2
    weekend_eve_duration: 2
    holiday_eve_duration: 2

    late_cutover_time: "18:30"

    exceptions:
      "Halloween":
        day_end: "22:30"
        eve_duration: 1.5
      "Christmas Eve":
        day_end: "22:30"
        eve_duration: 1.5
      "New Year's Eve":
        day_end: "00:30"
        eve_duration: 1

    exception: "{{ exceptions.get(holiday_name, {}) }}"

    day_start_time: "{{ weekend_day_start if is_weekend else exception.get('day_start', holiday_day_start) if is_holiday else default_day_start }}"
    day_end_time: "{{ weekend_day_end if is_weekend else exception.get('day_end', holiday_day_end) if is_holiday else default_day_end }}"

    day_start: "{{ today_at(day_start_time) + timedelta(days=anchor_offset) }}"
    day_end_base: "{{ today_at(day_end_time) + timedelta(days=anchor_offset) }}"
    day_end: "{{ day_end_base|as_datetime + timedelta(days=1) if day_end_base|as_datetime <= day_start|as_datetime else day_end_base|as_datetime }}"

    eve_start: "{{ day_end|as_datetime }}"
    eve_duration_hours: "{{ weekend_eve_duration if is_weekend else exception.get('eve_duration', holiday_eve_duration) if is_holiday else default_eve_duration }}"
    eve_end: "{{ eve_start|as_datetime + timedelta(hours=eve_duration_hours) }}"

    in_daytime: "{{ now_dt|as_datetime >= day_start|as_datetime and now_dt|as_datetime < day_end|as_datetime }}"
    in_evening: "{{ now_dt|as_datetime >= eve_start|as_datetime and now_dt|as_datetime < eve_end|as_datetime }}"

    late_cutover: "{{ today_at(late_cutover_time) + timedelta(days=anchor_offset) }}"
    is_late: "{{ now_dt|as_datetime >= late_cutover|as_datetime }}"
    effective_evening: "{{ in_evening or (override_on and is_late) }}"
    effective_daytime: "{{ (in_daytime or (override_on and not is_late)) and not effective_evening }}"

    kids_start: "{{ day_start|as_datetime + timedelta(hours=1.5) }}"
    kids_end: "{{ day_end|as_datetime - timedelta(hours=1) }}"
    kids_daytime: "{{ kids_end|as_datetime > kids_start|as_datetime and (now_dt|as_datetime >= kids_start|as_datetime) and (now_dt|as_datetime < kids_end|as_datetime) }}"

  binary_sensor:
    - name: Daytime
      unique_id: daytime_sensor
      device_class: running
      state: "{{ effective_daytime }}"
      attributes:
        holiday_name: "{{ holiday_name }}"
        is_holiday: "{{ is_holiday }}"
        is_weekend: "{{ is_weekend }}"
        anchor_offset_days: "{{ anchor_offset }}"
        day_start: "{{ day_start }}"
        day_end: "{{ day_end }}"

    - name: Kids Daytime
      unique_id: kids_daytime_sensor
      device_class: running
      state: "{{ kids_daytime }}"
      attributes:
        holiday_name: "{{ holiday_name }}"
        is_holiday: "{{ is_holiday }}"
        is_weekend: "{{ is_weekend }}"
        anchor_offset_days: "{{ anchor_offset}}"
        day_start: "{{ day_start }}"
        day_end: "{{ day_end }}"
        kids_start: "{{ kids_start }}"
        kids_end: "{{ kids_end }}"

    - name: Evening
      unique_id: evening_sensor
      device_class: running
      state: "{{ effective_evening }}"
      attributes:
        holiday_name: "{{ holiday_name }}"
        is_holiday: "{{ is_holiday }}"
        is_weekend: "{{ is_weekend }}"
        anchor_offset_days: "{{ anchor_offset }}"
        eve_start: "{{ eve_start }}"
        eve_end: "{{ eve_end }}"
        eve_duration_hours: "{{ eve_duration_hours }}"

