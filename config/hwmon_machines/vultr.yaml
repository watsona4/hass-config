# =============================================================================
# Machine Configuration: Vultr VPS
# =============================================================================
#
# Cloud VPS running on Vultr. Lightweight monitoring for a small instance.
#
# =============================================================================

machine:
  name: Vultr
  slug: vultr
  telemetry_sensor: sensor.vultr_hardware_telemetry
  view_order: 9

# -----------------------------------------------------------------------------
# Sections
# -----------------------------------------------------------------------------
sections:

  # ---------------------------------------------------------------------------
  # Host / Status
  # ---------------------------------------------------------------------------
  host:
    enabled: true
    metrics:
      - uptime_s
      - process_count

  health:
    enabled: true
    metrics:
      - overall_ok
      - updates_pending

  # ---------------------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------------------
  services:
    enabled: true
    include:
      - iperf3
      - tailscaled

  # ---------------------------------------------------------------------------
  # CPU
  # ---------------------------------------------------------------------------
  cpu:
    enabled: true
    metrics:
      - load_pct
      - load_1m
      - load_5m
      - load_15m
      - num_physical_cores
      - num_logical_cores

  # ---------------------------------------------------------------------------
  # Memory
  # ---------------------------------------------------------------------------
  memory:
    enabled: true
    metrics:
      - system.load_pct
      - system.used_b
      - system.available_b
      - system.total_b
      - virtual.load_pct

  # ---------------------------------------------------------------------------
  # Filesystems
  # ---------------------------------------------------------------------------
  filesystems:
    enabled: true
    include:
      - mountpoint: /
        display_name: Root

  # ---------------------------------------------------------------------------
  # Network Interfaces
  # ---------------------------------------------------------------------------
  network:
    enabled: true
    include:
      - name: enp1s0
        display_name: Public
      - name: tailscale0
        display_name: Tailscale

# -----------------------------------------------------------------------------
# Dashboard Display Options
# -----------------------------------------------------------------------------
dashboard:
  overview:
    display_name: Vultr VPS
    filesystems:
      - slug: root
        label: Disk
    temp_suffix: null  # No CPU temp available on VPS
    gpu:
      enabled: false
    tpu:
      enabled: false
    services:
      display: auto
    containers:
      display: null

  detail_sections:
    - title: System Status
      cards: [uptime, updates, health_summary]
    - title: CPU
      cards: [cpu_load, cpu_cores]
    - title: Memory
      cards: [memory_used, swap]
    - title: Storage
      cards: [filesystems]
    - title: Network
      cards: [network_interfaces]
    - title: Services
      cards: [services_status]
