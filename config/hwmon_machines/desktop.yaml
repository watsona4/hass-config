# =============================================================================
# Machine Configuration: Desktop
# =============================================================================
#
# Dell OptiPlex 9020 Mini Tower running Windows 10 with NVIDIA GTX 1070.
# Monitored via LibreHardwareMonitor providing CPU, memory, disk, and GPU
# telemetry. Includes WiFi stats, drive health, and Windows service monitoring.
#
# =============================================================================

machine:
  name: Desktop
  slug: desktop
  telemetry_sensor: sensor.desktop_bq063ig_hardware_telemetry
  view_order: 5

# -----------------------------------------------------------------------------
# Sections
# -----------------------------------------------------------------------------
sections:

  # ---------------------------------------------------------------------------
  # Host / Status
  # ---------------------------------------------------------------------------
  host:
    enabled: true
    metrics:
      - uptime_s
      - process_count

  health:
    enabled: true
    metrics:
      - overall_ok
      - updates_pending

  # ---------------------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------------------
  services:
    enabled: true
    include:
      - Dnscache
      - LanmanServer
      - LibreHardwareMonitor
      - Spooler

  # ---------------------------------------------------------------------------
  # CPU
  # ---------------------------------------------------------------------------
  cpu:
    enabled: true
    metrics:
      - load_pct
      - load_1m
      - load_5m
      - load_15m
      - temp_c
      - power_w
      - num_physical_cores
      - num_logical_cores

  # ---------------------------------------------------------------------------
  # Memory
  # ---------------------------------------------------------------------------
  memory:
    enabled: true
    metrics:
      - system.load_pct
      - system.used_b
      - system.available_b
      - system.total_b
      - virtual.load_pct

  # ---------------------------------------------------------------------------
  # Filesystems
  # ---------------------------------------------------------------------------
  filesystems:
    enabled: true
    include:
      - label: Windows
        display_name: Windows (C:)
      - label: Data
        display_name: Data (D:)

  # ---------------------------------------------------------------------------
  # Drives (with SMART)
  # ---------------------------------------------------------------------------
  drives:
    enabled: true
    include:
      - name: PhysicalDrive0
        display_name: SK hynix 256GB SSD
      - name: PhysicalDrive1
        display_name: WD 1TB HDD
    metrics:
      - temp_c
      - smart.overall_health
      - smart.wear_leveling_pct

  # ---------------------------------------------------------------------------
  # Network Interfaces
  # ---------------------------------------------------------------------------
  network:
    enabled: true
    include:
      - name: Wi-Fi 2
        display_name: WiFi

  # ---------------------------------------------------------------------------
  # WiFi
  # ---------------------------------------------------------------------------
  wifi:
    enabled: true
    interface: Wi-Fi 2
    metrics:
      - essid
      - signal_pct
      - signal_dbm
      - channel
      - bitrate_mbps

  # ---------------------------------------------------------------------------
  # GPUs
  # ---------------------------------------------------------------------------
  gpus:
    enabled: true
    metrics:
      - core.load_pct
      - core.power_w
      - temp_c

# -----------------------------------------------------------------------------
# Dashboard Display Options
# -----------------------------------------------------------------------------
dashboard:
  # Overview page configuration (01_overview.yaml)
  overview:
    display_name: Desktop
    filesystems:
      - slug: windows_c
        label: SK hynix 256GB SSD
      - slug: data_d
        label: WD 1TB HDD
    temp_suffix: cpu_temp
    gpu:
      enabled: true
      suffix: gpu_utilization
      label: NVIDIA GTX 1070
    tpu:
      enabled: false
    services:
      display: chips
      chips:
        - libre_hardware_monitor
        - dnscache
        - lanman_server
        - spooler
    containers:
      display: null

  detail_sections:
    - title: System Status
      cards: [uptime, updates, health_summary]
    - title: CPU
      cards: [cpu_load, cpu_temp, cpu_power]
    - title: Memory
      cards: [memory_used, swap]
    - title: Storage
      cards: [filesystems, drive_health]
    - title: Network
      cards: [network_interfaces, wifi_stats]
    - title: GPU
      cards: [gpu_load, gpu_temp]
    - title: Services
      cards: [services_status]
