# =============================================================================
# Machine Configuration: RV Home Assistant Yellow
# =============================================================================
#
# Home Assistant Yellow running HAOS in the RV. Compact all-in-one HA appliance
# with integrated Zigbee/Thread radio. Monitors system health, CPU, memory,
# storage, and network connectivity.
#
# =============================================================================

machine:
  name: RV Hass
  slug: rvhass
  telemetry_sensor: sensor.a0d7b954_ssh_hardware_telemetry
  view_order: 8

# -----------------------------------------------------------------------------
# Sections
# -----------------------------------------------------------------------------
sections:

  # ---------------------------------------------------------------------------
  # Host / Status
  # ---------------------------------------------------------------------------
  host:
    enabled: true
    metrics:
      - uptime_s
      - process_count

  health:
    enabled: true
    metrics:
      - overall_ok
      - updates_pending

  # ---------------------------------------------------------------------------
  # Services (HAOS doesn't expose traditional services)
  # ---------------------------------------------------------------------------
  services:
    enabled: false

  # ---------------------------------------------------------------------------
  # CPU
  # ---------------------------------------------------------------------------
  cpu:
    enabled: true
    metrics:
      - load_pct
      - load_1m
      - load_5m
      - load_15m
      - temp_c
      - num_physical_cores
      - num_logical_cores

  # ---------------------------------------------------------------------------
  # Memory
  # ---------------------------------------------------------------------------
  memory:
    enabled: true
    metrics:
      - system.load_pct
      - system.used_b
      - system.available_b
      - system.total_b
      - virtual.load_pct

  # ---------------------------------------------------------------------------
  # Filesystems (HAOS reports mountpoints, not labels)
  # ---------------------------------------------------------------------------
  filesystems:
    enabled: true
    include:
      - mountpoint: /data
        display_name: Data

  # ---------------------------------------------------------------------------
  # Network Interfaces
  # ---------------------------------------------------------------------------
  network:
    enabled: true
    include:
      - name: end0
        display_name: Ethernet
      - name: tailscale0
        display_name: Tailscale

# -----------------------------------------------------------------------------
# Dashboard Display Options
# -----------------------------------------------------------------------------
dashboard:
  # Overview page configuration (01_overview.yaml)
  overview:
    display_name: RV HA Yellow
    filesystems:
      - slug: data
        label: eMMC Storage
    temp_suffix: cpu_temp
    gpu:
      enabled: false
    tpu:
      enabled: false
    services:
      display: auto
    containers:
      display: null

  detail_sections:
    - title: System Status
      cards: [uptime, updates, health_summary]
    - title: CPU
      cards: [cpu_load, cpu_temp]
    - title: Memory
      cards: [memory_used, swap]
    - title: Storage
      cards: [filesystems]
    - title: Network
      cards: [network_interfaces]
