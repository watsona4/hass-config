
# Loads default set of integrations. Do not remove.
default_config:

go2rtc:
  url: http://127.0.0.1:1984

homeassistant:
  external_url: "https://hass.battenkillwoodworks.com"
  internal_url: "http://frigate.home.arpa:8123"
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - 10.10.10.0/24
  auth_mfa_modules:
    - type: totp
  packages: !include_dir_named packages

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.10.10.1
    - 127.0.0.1
    - 2603:7080:8a00:5b00::/64
  ip_ban_enabled: false

logger:
  default: warning
  logs:
    annotatedyaml.constructors: error
    homeassistant.components.apple_tv: critical
    homeassistant.components.bluetooth.active_update_coordinator: critical
    homeassistant.components.bluetooth.manager: critical
    homeassistant.components.bluetooth.passive_update_coordinator: critical
    homeassistant.components.opower.coordinator: critical
    homeassistant.components.recorder: info
    homeassistant.components.rest_command: info
    homeassistant.components.switchbot.coordinator: critical
    homeassistant.components.switchbot.cover: critical
    homeassistant.components.switchbot: critical
    homeassistant.core: info
    homeassistant.core_config: error
    homeassistant.helpers.event: info
    homeassistant.helpers.template: debug
    homeassistant.loader: error
    pyatv: critical
    sqlalchemy.engine.Engine: warning
  filters:
    homeassistant.components.mqtt.entity:
      - "deprecated option `object_id`"
    homeassistant.components.dhcp:
      - "The deprecated constant DhcpServiceInfo was used from aquanta"

recorder:
  db_url: "postgresql://ha:ufEOx3ZH8NBwD2HEfnJquHbk@127.0.0.1/homeassistant_db"
  purge_keep_days: 30
  auto_purge: true
  auto_repack: true
  commit_interval: 10
  exclude:
    domains:
      - updater
      - sun
    event_types:
      - google_pollen_nearby_update
      - google_pollen_home_update
      - google_pollen_rv_update
      - openmeteo_nearby_update
      - openmeteo_home_update
      - openmeteo_rv_update
      - waqi_nearby_update
      - waqi_home_update
      - waqi_rv_update
      - strava_activities_update
      - strava_latest_photos_update
      - xert_activity_list_update
      - xert_training_info_update
      - zwift_activities_update
      - zwift_profile_update
      - zwift_status_update
      - zwift_world_update
    entities:
      - device_tracker.rv_gps
      - sensor.strava_activities_raw
      - sensor.zwift_activity_data
      - sensor.xert_activity_list_raw
      - sensor.xert_activity_list_update
      - automation.rv_gps_statestream_merged_json
      - script.single_window
      - script.window_position
      - sensor.rv_bridge_location_raw
    entity_globs:
      - sensor.frigate_*
      - sensor.icloud3_*_next_update
      - sensor.*_wi_fi_signal
      - sensor.*_voltage
      - sensor.ui_*
      - sensor.*_rssi
      - sensor.*_linkquality
      - sensor.*_uptime
      - sensor.*_last_seen
      - sensor.*_signal_strength
      - sensor.*_weight_projection
      - sensor.*_bodyfat_projection
      - sensor.*_weight_events
      - sensor.*_bodyfat_events
      - sensor.google_pollen_*
      - sensor.openmeteo_*
      - sensor.pollen_species_list_*_today
      - sensor.pollen_forecast_*_day_*
      - sensor.*_hardware_telemetry
      - binary_sensor.usb_current_monitor_webcam_running

pyscript:
  allow_all_imports: true
  hass_is_global: true

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/hass-bha-icons.js
    - /local/community/lovelace-card-mod/card-mod.js

