zone:
  - name: Home
    latitude: !secret home_latitude
    longitude: !secret home_longitude
    radius: 100
    icon: mdi:home

# Built-in YAML includes
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Custom YAML entities
mqtt: !include includes/mqtt.yaml
template: !include includes/template.yaml
sensor: !include includes/sensor.yaml

notify:
  # This notification group aggregates Aaron's personal and work cell phones
  - platform: group
    name: "Aaron Phones"
    unique_id: aaron_phones
    services:
      - action: mobile_app_pixel_9_pro_xl
      - action: mobile_app_l144jy6rmq_iphone

  # This notification group aggregates Aaron's personal and work cell phones and
  # Ashley's ce phone.
  - platform: group
    name: "Aaron and Ashley Phones"
    unique_id: aaron_and_ashley_phones
    services:
      - action: mobile_app_pixel_9_pro_xl
      - action: mobile_app_l144jy6rmq_iphone
      - action: mobile_app_ashleys_iphone
