# =============================================================================
# Package: Vultr Hardware Monitor
# =============================================================================
#
# Auto-generated by generate_hwmon_assets.py
# DO NOT EDIT - Changes will be overwritten
#
# Monitors Vultr system telemetry via MQTT and provides:
#   - Data sensors for CPU, memory, disk, network, etc.
#   - UI sensors for dashboard card attributes
#   - Binary sensors for health status
#
# Source telemetry sensor: sensor.vultr_hardware_telemetry
#
# =============================================================================

template:
  # ---------------------------------------------------------------------------
  # Data Sensors: Vultr
  # ---------------------------------------------------------------------------
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.vultr_hardware_telemetry
    variables:
      entity_id: sensor.vultr_hardware_telemetry
      available: "{{ has_value(entity_id) }}"
      host: "{{ state_attr(entity_id, 'host') or {} }}"
      health: "{{ state_attr(entity_id, 'health') or {} }}"
      cpus: "{{ state_attr(entity_id, 'cpus') or [] }}"
      memory: "{{ state_attr(entity_id, 'memory') or {} }}"
      filesystems: "{{ state_attr(entity_id, 'filesystems') or [] }}"
      ifaces: "{{ state_attr(entity_id, 'ifaces') or [] }}"
      gpus: "{{ state_attr(entity_id, 'gpus') or [] }}"
      tpus: "{{ state_attr(entity_id, 'tpus') or [] }}"
    sensor:
      - name: "Vultr Uptime (s)"
        unique_id: 8722a3e7-88b1-55d8-aa3b-13f4cda55a31
        availability: "{{ available }}"
        state: "{{ (host.uptime_s | default(0)) | int }}"
        icon: "mdi:timer-outline"
        unit_of_measurement: "s"
        state_class: measurement
        device_class: duration
      - name: "Vultr Process Count"
        unique_id: 0adb4b54-9262-5def-bcd4-fc8aa72ef39e
        availability: "{{ available }}"
        state: "{{ (host.process_count | default(0)) | int }}"
        icon: "mdi:application"
        state_class: measurement
      - name: "Vultr Overall Status Summary"
        unique_id: abb89284-ba40-5742-9729-ae37b01bcc73
        availability: "{{ available }}"
        state: >-
          {{ (health.issues[0][:250] ~ '...') if health.issues and health.issues[0]|length > 250 else (health.issues[0] if health.issues else 'OK') }}
        icon: "mdi:card-text-outline"
      - name: "Vultr Updates Pending"
        unique_id: dee5c71d-91c2-5f06-b4b2-850a73e6bba1
        availability: "{{ available }}"
        state: >-
          {{ ((health.updates | default({})).pending | default(0)) | int }}
        icon: "mdi:update"
        state_class: measurement
      - name: "Vultr Updates List"
        unique_id: 21b9b3a3-d233-50bd-a119-0f4a8b6656d4
        availability: "{{ available }}"
        state: >-
          {{ ((health.updates | default({})).get('items', []) | map(attribute='name') | list | length) }} packages
        icon: "mdi:package-variant"
        attributes:
          packages: "{{ (health.updates | default({})).get('items', []) | map(attribute='name') | list }}"
      - name: "Vultr Services Checked"
        unique_id: 6a95b3be-d8f5-5c05-b826-ca9c35831c08
        availability: "{{ available }}"
        state: "{{ (health.services | default([]) | length) }}"
        icon: "mdi:playlist-check"
        state_class: measurement
      - name: "Vultr Containers Checked"
        unique_id: 2bbbd189-617b-51d5-821e-59d8ba8441fd
        availability: "{{ available }}"
        state: "{{ (health.containers | default([]) | length) }}"
        icon: "mdi:docker"
        state_class: measurement
      - name: "Vultr CPU Utilization"
        unique_id: 876cee24-d664-5a03-bf39-98951a9f4c88
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_pct | default(0)) | round(1) }}"
        icon: "mdi:chip"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "Vultr CPU Load 1m"
        unique_id: acae24ee-696d-5971-b9aa-871779f0c8ec
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_1m | default(0)) | round(2) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "Vultr CPU Load 5m"
        unique_id: cf61ba92-8159-5124-ae01-c09b30193a7f
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_5m | default(0)) | round(2) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "Vultr CPU Load 15m"
        unique_id: f0411a16-ecfc-56a1-bb3b-9eac8770c426
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_15m | default(0)) | round(2) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "Vultr CPU Physical Cores"
        unique_id: f347136a-4370-58d9-9662-fa9d8e6beba6
        availability: "{{ available }}"
        state: "{{ cpus[0].num_physical_cores | default(0) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "Vultr CPU Logical Cores"
        unique_id: 811b09ba-604d-558e-9dc1-c7a64006f006
        availability: "{{ available }}"
        state: "{{ cpus[0].num_logical_cores | default(0) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "Vultr Memory Percent"
        unique_id: 3d97aa72-fbf9-52ac-9992-40c29cab2ce7
        availability: "{{ available }}"
        state: "{{ (memory.system.load_pct | default(0)) | round(1) }}"
        icon: "mdi:memory"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "Vultr Memory Used"
        unique_id: 3cf65d7c-054d-52a4-8218-27684325bb39
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.used_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "Vultr Memory Available"
        unique_id: 4c002ff7-3caa-5255-b351-76e3caba624c
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.available_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "Vultr Memory Total"
        unique_id: bc27ffb2-a510-584d-ae65-69b8837e9b1c
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.total_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "Vultr Swap Percent"
        unique_id: ad7c50e2-f017-5e95-8d88-d977d835ecc8
        availability: "{{ available }}"
        state: "{{ (memory.virtual.load_pct | default(0)) | round(1) }}"
        icon: "mdi:memory"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "Vultr FS Root Percent"
        unique_id: 88ac0472-ad17-58f9-b4a4-b17a1b87c8ba
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('mountpoint', 'eq', '/') | first | default(none) %}{{ ((fs.used_b / (fs.used_b + fs.available_b)) * 100) | round(1) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "Vultr FS Root Used"
        unique_id: b2818b22-7818-5eab-8e18-c0f0443a0d06
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('mountpoint', 'eq', '/') | first | default(none) %}{{ ((fs.used_b | default(0)) / 1073741824) | round(2) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "Vultr FS Root Total"
        unique_id: c60d1c39-509f-5fdd-b11e-0ce6b447a10c
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('mountpoint', 'eq', '/') | first | default(none) %}{{ (((fs.used_b | default(0)) + (fs.available_b | default(0))) / 1073741824) | round(2) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "Vultr Public Upload"
        unique_id: 56a7897f-4fc3-5187-977c-ee7eb185bea9
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ (iface.rate_up_bps | default(0)) | round(0) if iface else 0 }}
        icon: "mdi:upload"
        unit_of_measurement: "B/s"
        device_class: data_rate
      - name: "Vultr Public Download"
        unique_id: c0a71c8a-673a-5422-b244-3a1ea1c9b4e0
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ (iface.rate_down_bps | default(0)) | round(0) if iface else 0 }}
        icon: "mdi:download"
        unit_of_measurement: "B/s"
        device_class: data_rate
      - name: "Vultr Public IPv4"
        unique_id: 8f869479-bedd-53e3-8b4d-50179136662b
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.ipv4 | default('unknown') if iface else 'unknown' }}
      - name: "Vultr Public Info"
        unique_id: 912e5bad-83ae-5270-b1d4-2adb09678823
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.name | default('Unknown') if iface else 'Unknown' }}
        icon: "mdi:ethernet"
        attributes:
          name: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.name | default('Unknown') if iface else 'Unknown' }}"
          mac: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.mac | default('Unknown') if iface else 'Unknown' }}"
          ipv4: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.ipv4 | default('None') if iface else 'None' }}"
          ipv6: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.ipv6 | default('None') if iface else 'None' }}"
          link_speed_mbps: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.link_speed_mbps | default(0) if iface else 0 }}"
          duplex: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.duplex | default('unknown') if iface else 'unknown' }}"
          mtu: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.mtu | default(0) if iface else 0 }}"
          carrier: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.carrier | default(false) if iface else false }}"
          driver: "{% set iface = ifaces | selectattr('name', 'eq', 'enp1s0') | first | default(none) %}{{ iface.driver | default('Unknown') if iface else 'Unknown' }}"
      - name: "Vultr Tailscale Upload"
        unique_id: 3036f577-66af-5f6f-8659-da4a9abd3cf0
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ (iface.rate_up_bps | default(0)) | round(0) if iface else 0 }}
        icon: "mdi:upload"
        unit_of_measurement: "B/s"
        device_class: data_rate
      - name: "Vultr Tailscale Download"
        unique_id: 2a3380a1-8a0b-5335-986e-d8d6d80fbd10
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ (iface.rate_down_bps | default(0)) | round(0) if iface else 0 }}
        icon: "mdi:download"
        unit_of_measurement: "B/s"
        device_class: data_rate
      - name: "Vultr Tailscale IPv4"
        unique_id: b20f04b5-fbf3-57a6-b68d-a54601ab3f8b
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.ipv4 | default('unknown') if iface else 'unknown' }}
      - name: "Vultr Tailscale Info"
        unique_id: e6413318-3ba3-5e3c-bf71-5d69b878efb9
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.name | default('Unknown') if iface else 'Unknown' }}
        icon: "mdi:ethernet"
        attributes:
          name: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.name | default('Unknown') if iface else 'Unknown' }}"
          mac: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.mac | default('Unknown') if iface else 'Unknown' }}"
          ipv4: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.ipv4 | default('None') if iface else 'None' }}"
          ipv6: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.ipv6 | default('None') if iface else 'None' }}"
          link_speed_mbps: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.link_speed_mbps | default(0) if iface else 0 }}"
          duplex: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.duplex | default('unknown') if iface else 'unknown' }}"
          mtu: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.mtu | default(0) if iface else 0 }}"
          carrier: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.carrier | default(false) if iface else false }}"
          driver: "{% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.driver | default('Unknown') if iface else 'Unknown' }}"
    binary_sensor:
      - name: "Vultr Overall Status OK"
        unique_id: 281dfb31-3f64-5b3b-8659-971b2a33ad67
        availability: "{{ available }}"
        state: "{{ health.overall_ok | default(false) }}"
        icon: "mdi:check-circle"
      - name: "Vultr Status Alarm"
        unique_id: 1dcb4bab-cd71-5f27-9463-c50b3e28b842
        availability: "{{ available }}"
        state: "{{ not (health.overall_ok | default(true)) }}"
        device_class: problem
      - name: "Vultr Services OK"
        unique_id: 99ae0370-879b-5d95-8ede-fde146d099b5
        availability: "{{ available }}"
        state: >-
          {% set tracked = ['iperf3', 'tailscaled'] %}{% set svc_list = health.services | default([]) %}{{ svc_list | selectattr('name', 'in', tracked) | selectattr('ok', 'eq', false) | list | length == 0 }}
        icon: "mdi:check-circle"
      - name: "Vultr Display Services"
        unique_id: 10ec65a3-6c0a-5b18-bd91-cbf4c5937f34
        availability: "{{ available }}"
        state: >-
          {% set tracked = ['iperf3', 'tailscaled'] %}{% set svc_list = health.services | default([]) %}{{ svc_list | selectattr('name', 'in', tracked) | selectattr('ok', 'eq', false) | list | length > 0 }}
        icon: "mdi:cog-off"
      - name: "Vultr Service iperf3"
        unique_id: 09c954cc-6a95-5861-95e9-08b8b2f0fff6
        availability: "{{ available }}"
        state: >-
          {% set svc = health.services | default([]) | selectattr('name', 'eq', 'iperf3') | first | default(none) %}{{ svc.ok | default(false) if svc else false }}
        icon: "mdi:cog"
      - name: "Vultr Service tailscaled"
        unique_id: f6dbd0cc-c9e3-5bbd-b39a-443579be6e6e
        availability: "{{ available }}"
        state: >-
          {% set svc = health.services | default([]) | selectattr('name', 'eq', 'tailscaled') | first | default(none) %}{{ svc.ok | default(false) if svc else false }}
        icon: "mdi:cog"

