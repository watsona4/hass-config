  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.vultr_cpu_load_1m
          - sensor.vultr_cpu_load_5m
          - sensor.vultr_cpu_load_15m
          - sensor.vultr_cpu_logical_cores
    variables:
      entity_id: sensor.vultr_cpu_load_1m
      app: cpu_load
      options:
        cores: sensor.vultr_cpu_logical_cores
      state_info: >-
        {%- from 'main.jinja' import get_device_state_info -%}
        {{ get_device_state_info(entity_id, app, options=options) | from_json }}
      state_info_vertical: >-
        {%- from 'main.jinja' import get_device_state_info -%}
        {{ get_device_state_info(entity_id, app, layout='vertical', options=options) | from_json }}
    sensor:
      - name: ui_vultr_cpu_load_1m
        unique_id: 3223c612-4850-54e5-8955-87765737126f
        state: "{{ states(entity_id) }}"
