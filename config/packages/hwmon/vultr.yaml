          icon: "{{ state_info.icon }}"
          color: "{{ state_info.color }}"
          badge: "{{ state_info.badge }}"
          badge_color: "{{ state_info.badge_color }}"
          label: "{{ state_info.label }}"
          short_label: "{{ state_info.short_label }}"
          long_label: "{{ state_info.long_label }}"
          label_vertical: "{{ state_info_vertical.label }}"
          short_label_vertical: "{{ state_info_vertical.short_label }}"
          long_label_vertical: "{{ state_info_vertical.long_label }}"
          app: cpu_load
          device_class: none
          long_desc: >-
            {%- set m1 = states('sensor.vultr_cpu_load_1m')|float(0) -%}{%- set m5 = states('sensor.vultr_cpu_load_5m')|float(0) -%}{%- set m15 = states('sensor.vultr_cpu_load_15m')|float(0) -%}{%- set c = states('sensor.vultr_cpu_logical_cores')|int(0) -%}{{- '1m: ' ~ m1 ~ ' • 5m: ' ~ m5 ~ ' • 15m: ' ~ m15 ~ ' • ' ~ c ~ ' cores' -}}
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.vultr_memory_percent
          - sensor.vultr_memory_used
          - sensor.vultr_memory_total
          - sensor.vultr_memory_available
    variables:
      entity_id: sensor.vultr_memory_percent
      app: memory_utilization
      options:
        used: sensor.vultr_memory_used
      state_info: >-
        {%- from 'main.jinja' import get_device_state_info -%}
        {{ get_device_state_info(entity_id, app, options=options) | from_json }}
      state_info_vertical: >-
        {%- from 'main.jinja' import get_device_state_info -%}
        {{ get_device_state_info(entity_id, app, layout='vertical', options=options) | from_json }}
    sensor:
      - name: ui_vultr_memory_percent
        unique_id: f14f7d78-a6fc-5e52-93ac-3069e98013b7
