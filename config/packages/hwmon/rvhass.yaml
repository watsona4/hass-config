        device_class: data_rate
      - name: "RV Hass Tailscale Download"
        unique_id: ac7d047f-419f-5b06-ac08-bc6e1016bbed
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ (iface.rate_down_bps | default(0)) | round(0) if iface else 0 }}
        icon: "mdi:download"
        unit_of_measurement: "B/s"
        device_class: data_rate
      - name: "RV Hass Tailscale IPv4"
        unique_id: 19b11707-9ea4-53d5-9cd1-646f147e10a4
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'tailscale0') | first | default(none) %}{{ iface.ipv4 | default('unknown') if iface else 'unknown' }}
      - name: "RV Hass Tailscale Info"
