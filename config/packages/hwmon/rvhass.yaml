        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('mountpoint', 'eq', '/data') | first | default(none) %}{{ ((fs.used_b / (fs.used_b + fs.available_b)) * 100) | round(1) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "RV Hass FS Data Used"
        unique_id: 9ffa4273-95d0-5302-8d0e-1d8e9a82b36d
