        state_class: measurement
      - name: "RV Hass Memory Used"
        unique_id: 3c3439df-1304-55f3-b81a-914f2386266d
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.used_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RV Hass Memory Available"
        unique_id: f4f1490e-0a2a-5a76-ab09-50cc4d6f3e5c
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.available_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RV Hass Memory Total"
        unique_id: b9034723-9d16-5d88-9d46-055f0aa59b3d
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.total_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
