        state_class: measurement
      - name: "RV Hass Updates List"
        unique_id: b9a1b26c-21bb-585b-b112-11d5b38e5295
        availability: "{{ available }}"
        state: >-
          {{ ((health.updates | default({})).get('items', []) | map(attribute='name') | list | length) }} packages
        icon: "mdi:package-variant"
        attributes:
          packages: "{{ (health.updates | default({})).get('items', []) | map(attribute='name') | list }}"
      - name: "RV Hass Services Checked"
        unique_id: d614b19e-f934-553d-8786-a7ecfd500230
        availability: "{{ available }}"
        state: "{{ (health.services | default([]) | length) }}"
        icon: "mdi:playlist-check"
        state_class: measurement
      - name: "RV Hass Containers Checked"
        unique_id: 9eb693a1-6ab4-501c-aaa1-322aaf0bba6b
        availability: "{{ available }}"
        state: "{{ (health.containers | default([]) | length) }}"
        icon: "mdi:docker"
        state_class: measurement
      - name: "RV Hass CPU Utilization"
        unique_id: f8480c95-ead4-53dd-86db-cc637e744ae9
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_pct | default(0)) | round(1) }}"
