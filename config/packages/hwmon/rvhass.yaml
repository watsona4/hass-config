        state: "{{ states(entity_id) }}"
        attributes:
          value: "{{ state_info.value }}"
          name: "{{ state_info.name }}"
          default_desc: "{{ state_info.default_desc }}"
          short_desc: "{{ state_info.short_desc }}"
          full_desc: "{{ state_info.full_desc }}"
          icon: "{{ state_info.icon }}"
          color: "{{ state_info.color }}"
          badge: "{{ state_info.badge }}"
          badge_color: "{{ state_info.badge_color }}"
          label: "{{ state_info.label }}"
          short_label: "{{ state_info.short_label }}"
          long_label: "{{ state_info.long_label }}"
          label_vertical: "{{ state_info_vertical.label }}"
          short_label_vertical: "{{ state_info_vertical.short_label }}"
          long_label_vertical: "{{ state_info_vertical.long_label }}"
          app: connectivity
          device_class: binary
          system_icon: >-
            {%- set host = state_attr('sensor.a0d7b954_ssh_hardware_telemetry', 'host') | default({}) -%}{%- set chassis = (host['chassis_type'] | default('Desktop')) | lower -%}{%- set icons = {'notebook': 'mdi:laptop', 'laptop': 'mdi:laptop', 'desktop': 'mdi:desktop-tower', 'server': 'mdi:server', 'tablet': 'mdi:tablet'} -%}{{- icons.get(chassis, 'mdi:desktop-tower') -}}
          system_color: >-
            {%- set host = state_attr('sensor.a0d7b954_ssh_hardware_telemetry', 'host') | default({}) -%}{%- set os = (host['system'] | default('')) | lower -%}{{- 'blue' if 'windows' in os else ('orange' if 'linux' in os else ('purple' if 'freebsd' in os else 'grey')) -}}
          system_primary: >-
            {%- set host = state_attr('sensor.a0d7b954_ssh_hardware_telemetry', 'host') | default({}) -%}{{- host['name'] | default('Unknown') -}}
          system_secondary: >-
            {%- set h = state_attr('sensor.a0d7b954_ssh_hardware_telemetry', 'host') | default({}) -%}{%- set model = h['model'] | default('Unknown') -%}{%- set serial = h['serial'] | default('N/A') -%}{%- set system = h['system'] | default('Unknown') -%}{%- set release = h['release'] | default('') -%}{%- set machine = h['machine'] | default('') -%}{%- set os_str = h['os'] | default('') -%}{%- set build = os_str.split('-')[2] if '-' in os_str else os_str -%}{{- model ~ ' (Serial: ' ~ serial ~ ')\n' ~ system ~ ' ' ~ release ~ ' (' ~ machine ~ ')\nBuild: ' ~ build -}}
