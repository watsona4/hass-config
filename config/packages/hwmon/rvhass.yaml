          link_speed_mbps: "{% set iface = ifaces | selectattr('name', 'eq', 'end0') | first | default(none) %}{{ iface.link_speed_mbps | default(0) if iface else 0 }}"
          duplex: "{% set iface = ifaces | selectattr('name', 'eq', 'end0') | first | default(none) %}{{ iface.duplex | default('unknown') if iface else 'unknown' }}"
          mtu: "{% set iface = ifaces | selectattr('name', 'eq', 'end0') | first | default(none) %}{{ iface.mtu | default(0) if iface else 0 }}"
          carrier: "{% set iface = ifaces | selectattr('name', 'eq', 'end0') | first | default(none) %}{{ iface.carrier | default(false) if iface else false }}"
          driver: "{% set iface = ifaces | selectattr('name', 'eq', 'end0') | first | default(none) %}{{ iface.driver | default('Unknown') if iface else 'Unknown' }}"
