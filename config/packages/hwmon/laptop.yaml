          firmware_version: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ d.firmware_version | default('Unknown') if d else 'Unknown' }}"
          capacity_gb: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ ((d.listed_cap_b | default(0)) / 1000000000) | round(0) | int if d else 0 }}"
          used_gb: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ ((d.used_b | default(0)) / 1073741824) | round(1) if d else 0 }}"
