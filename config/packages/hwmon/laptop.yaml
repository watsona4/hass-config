          used_pct: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{% if d %}{% set used = d.used_b | default(0) %}{% set avail = d.available_b | default(0) %}{% set total = used + avail %}{{ ((used / total) * 100) | round(1) if total > 0 else 0 }}{% else %}0{% endif %}"
          temp_c: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ d.temp_c | default(0) | int if d else 0 }}"
          health: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ d.get('smart', {}).get('overall_health', 'Unknown') if d else 'Unknown' }}"
          wear_level_pct: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ (100 - d.get('smart', {}).get('percentage_used_pct', 0)) | int if d else 100 }}"
          total_read_tb: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ ((d.total_read_b | default(0)) / 1099511627776) | round(2) if d else 0 }}"
          total_write_tb: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ ((d.total_write_b | default(0)) / 1099511627776) | round(2) if d else 0 }}"
          read_rate_mbps: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ ((d.read_rate_bps | default(0)) / 1048576) | round(1) if d else 0 }}"
          write_rate_mbps: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ ((d.write_rate_bps | default(0)) / 1048576) | round(1) if d else 0 }}"
          read_activity_pct: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ d.read_activity_pct | default(0) | round(1) if d else 0 }}"
          write_activity_pct: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ d.write_activity_pct | default(0) | round(1) if d else 0 }}"
          partitions: "{% set d = drives | selectattr('name', 'eq', 'PhysicalDrive0') | first | default(none) %}{{ (d.partitions | default([])) | tojson if d else '[]' }}"
      - name: "Laptop WiFi Network"
