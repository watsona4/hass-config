# =============================================================================
# Package: Frigate Hardware Monitor
# =============================================================================
#
# Auto-generated by generate_hwmon_assets.py
# DO NOT EDIT - Changes will be overwritten
#
# Monitors Frigate system telemetry via MQTT and provides:
#   - Data sensors for CPU, memory, disk, network, etc.
#   - UI sensors for dashboard card attributes
#   - Binary sensors for health status
#
# Source telemetry sensor: sensor.frigate_frigate_hardware_telemetry
#
# =============================================================================

template:
  # ---------------------------------------------------------------------------
  # Data Sensors: Frigate
  # ---------------------------------------------------------------------------
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.frigate_frigate_hardware_telemetry
    variables:
      entity_id: sensor.frigate_frigate_hardware_telemetry
      available: "{{ has_value(entity_id) }}"
      host: "{{ state_attr(entity_id, 'host') or {} }}"
      health: "{{ state_attr(entity_id, 'health') or {} }}"
      cpus: "{{ state_attr(entity_id, 'cpus') or [] }}"
      memory: "{{ state_attr(entity_id, 'memory') or {} }}"
      filesystems: "{{ state_attr(entity_id, 'filesystems') or [] }}"
      ifaces: "{{ state_attr(entity_id, 'ifaces') or [] }}"
      gpus: "{{ state_attr(entity_id, 'gpus') or [] }}"
      tpus: "{{ state_attr(entity_id, 'tpus') or [] }}"
      motherboard_temps: "{{ state_attr(entity_id, 'motherboard').get('temps', []) if state_attr(entity_id, 'motherboard') else [] }}"
      drives: "{{ state_attr(entity_id, 'drives') or [] }}"
    sensor:
      - name: "Frigate Uptime (s)"
        unique_id: 42cbc752-e428-517f-91b3-ca0258f11c0f
        availability: "{{ available }}"
        state: "{{ (host.uptime_s | default(0)) | int }}"
        icon: "mdi:timer-outline"
        unit_of_measurement: "s"
        state_class: measurement
        device_class: duration
      - name: "Frigate Process Count"
        unique_id: b380d071-1cda-5d4a-9b1e-3447d89c1fa0
        availability: "{{ available }}"
        state: "{{ (host.process_count | default(0)) | int }}"
        icon: "mdi:application"
        state_class: measurement
      - name: "Frigate Overall Status Summary"
        unique_id: 6b5dce45-0299-5b64-9ca8-151e6bbd531d
        availability: "{{ available }}"
        state: >-
          {{ (health.issues[0][:250] ~ '...') if health.issues and health.issues[0]|length > 250 else (health.issues[0] if health.issues else 'OK') }}
        icon: "mdi:card-text-outline"
      - name: "Frigate Updates Pending"
        unique_id: 8e363b36-41df-5d41-a64a-35748a32d147
        availability: "{{ available }}"
