          carrier: "{% set iface = ifaces | selectattr('name', 'eq', 'Wi-Fi 2') | first | default(none) %}{{ iface.carrier | default(false) if iface else false }}"
          driver: "{% set iface = ifaces | selectattr('name', 'eq', 'Wi-Fi 2') | first | default(none) %}{{ iface.driver | default('Unknown') if iface else 'Unknown' }}"
