# =============================================================================
# Package: Desktop Hardware Monitor
# =============================================================================
#
# Auto-generated by generate_hwmon_assets.py
# DO NOT EDIT - Changes will be overwritten
#
# Monitors Desktop system telemetry via MQTT and provides:
#   - Data sensors for CPU, memory, disk, network, etc.
#   - UI sensors for dashboard card attributes
#   - Binary sensors for health status
#
# Source telemetry sensor: sensor.desktop_bq063ig_desktop_bq063ig_hardware_telemetry
#
# =============================================================================

template:
  # ---------------------------------------------------------------------------
  # Data Sensors: Desktop
  # ---------------------------------------------------------------------------
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.desktop_bq063ig_desktop_bq063ig_hardware_telemetry
    variables:
      entity_id: sensor.desktop_bq063ig_desktop_bq063ig_hardware_telemetry
      available: "{{ has_value(entity_id) }}"
      host: "{{ state_attr(entity_id, 'host') or {} }}"
      health: "{{ state_attr(entity_id, 'health') or {} }}"
      cpus: "{{ state_attr(entity_id, 'cpus') or [] }}"
      memory: "{{ state_attr(entity_id, 'memory') or {} }}"
      filesystems: "{{ state_attr(entity_id, 'filesystems') or [] }}"
      ifaces: "{{ state_attr(entity_id, 'ifaces') or [] }}"
      gpus: "{{ state_attr(entity_id, 'gpus') or [] }}"
      tpus: "{{ state_attr(entity_id, 'tpus') or [] }}"
      drives: "{{ state_attr(entity_id, 'drives') or [] }}"
    sensor:
      - name: "Desktop Uptime (s)"
        unique_id: 85d59932-892d-5b57-9602-3df357d735a8
        availability: "{{ available }}"
        state: "{{ (host.uptime_s | default(0)) | int }}"
        icon: "mdi:timer-outline"
        unit_of_measurement: "s"
        state_class: measurement
        device_class: duration
      - name: "Desktop Process Count"
        unique_id: 303c6a65-3421-53fc-84bf-3c0248ee9040
        availability: "{{ available }}"
        state: "{{ (host.process_count | default(0)) | int }}"
        icon: "mdi:application"
        state_class: measurement
      - name: "Desktop Overall Status Summary"
        unique_id: d4bd66e8-2155-58ca-a097-2f2f25fef39a
        availability: "{{ available }}"
        state: >-
          {{ (health.issues[0][:250] ~ '...') if health.issues and health.issues[0]|length > 250 else (health.issues[0] if health.issues else 'OK') }}
        icon: "mdi:card-text-outline"
      - name: "Desktop Updates Pending"
        unique_id: 4f199976-ca51-5c92-8d5b-0515d09416c9
        availability: "{{ available }}"
        state: >-
          {{ ((health.updates | default({})).pending | default(0)) | int }}
        icon: "mdi:update"
        state_class: measurement
      - name: "Desktop Updates List"
        unique_id: 9bb15872-3036-5505-bfed-8b23b9b09dff
        availability: "{{ available }}"
        state: >-
          {{ ((health.updates | default({})).get('items', []) | map(attribute='name') | list | length) }} packages
        icon: "mdi:package-variant"
        attributes:
          packages: "{{ (health.updates | default({})).get('items', []) | map(attribute='name') | list }}"
      - name: "Desktop Services Checked"
        unique_id: f1f3ab44-800b-59ce-a132-7254c599c83f
