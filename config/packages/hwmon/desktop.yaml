          mac: "{% set iface = ifaces | selectattr('name', 'eq', 'Wi-Fi 2') | first | default(none) %}{{ iface.mac | default('Unknown') if iface else 'Unknown' }}"
          ipv4: "{% set iface = ifaces | selectattr('name', 'eq', 'Wi-Fi 2') | first | default(none) %}{{ iface.ipv4 | default('None') if iface else 'None' }}"
          ipv6: "{% set iface = ifaces | selectattr('name', 'eq', 'Wi-Fi 2') | first | default(none) %}{{ iface.ipv6 | default('None') if iface else 'None' }}"
