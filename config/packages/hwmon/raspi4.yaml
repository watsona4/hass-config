# =============================================================================
# Package: RasPi4 Hardware Monitor
# =============================================================================
#
# Auto-generated by generate_hwmon_assets.py
# DO NOT EDIT - Changes will be overwritten
#
# Monitors RasPi4 system telemetry via MQTT and provides:
#   - Data sensors for CPU, memory, disk, network, etc.
#   - UI sensors for dashboard card attributes
#   - Binary sensors for health status
#
# Source telemetry sensor: sensor.raspi4_hardware_telemetry
#
# =============================================================================

template:
  # ---------------------------------------------------------------------------
  # Data Sensors: RasPi4
  # ---------------------------------------------------------------------------
  - trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.raspi4_hardware_telemetry
    variables:
      entity_id: sensor.raspi4_hardware_telemetry
      available: "{{ has_value(entity_id) }}"
      host: "{{ state_attr(entity_id, 'host') or {} }}"
      health: "{{ state_attr(entity_id, 'health') or {} }}"
      cpus: "{{ state_attr(entity_id, 'cpus') or [] }}"
      memory: "{{ state_attr(entity_id, 'memory') or {} }}"
      filesystems: "{{ state_attr(entity_id, 'filesystems') or [] }}"
      ifaces: "{{ state_attr(entity_id, 'ifaces') or [] }}"
      gpus: "{{ state_attr(entity_id, 'gpus') or [] }}"
      tpus: "{{ state_attr(entity_id, 'tpus') or [] }}"
      sbc: "{{ state_attr(entity_id, 'host').get('sbc', {}) if state_attr(entity_id, 'host') else {} }}"
      throttling: "{{ state_attr(entity_id, 'host').get('throttling', {}) if state_attr(entity_id, 'host') else {} }}"
      time_server: "{{ state_attr(entity_id, 'time_server') or {} }}"
    sensor:
      - name: "RasPi4 Uptime (s)"
        unique_id: b6fc390c-33d6-5360-8ac2-ca65b2e6974f
        availability: "{{ available }}"
        state: "{{ (host.uptime_s | default(0)) | int }}"
        icon: "mdi:timer-outline"
        unit_of_measurement: "s"
        state_class: measurement
        device_class: duration
      - name: "RasPi4 Process Count"
        unique_id: cf19d5af-a44e-5c8a-bf6e-efeed4566c0f
        availability: "{{ available }}"
        state: "{{ (host.process_count | default(0)) | int }}"
        icon: "mdi:application"
        state_class: measurement
      - name: "RasPi4 Overall Status Summary"
        unique_id: 149ee01c-fcca-5ed5-8b00-9e1e83c634b6
        availability: "{{ available }}"
        state: >-
          {{ (health.issues[0][:250] ~ '...') if health.issues and health.issues[0]|length > 250 else (health.issues[0] if health.issues else 'OK') }}
        icon: "mdi:card-text-outline"
      - name: "RasPi4 Updates Pending"
        unique_id: a0b75846-4871-5ff6-ae97-bb93d3af14fb
        availability: "{{ available }}"
        state: >-
          {{ ((health.updates | default({})).pending | default(0)) | int }}
        icon: "mdi:update"
        state_class: measurement
      - name: "RasPi4 Updates List"
        unique_id: 9cefe719-2562-5279-be2c-fe6894d29d35
        availability: "{{ available }}"
        state: >-
          {{ ((health.updates | default({})).get('items', []) | map(attribute='name') | list | length) }} packages
        icon: "mdi:package-variant"
        attributes:
          packages: "{{ (health.updates | default({})).get('items', []) | map(attribute='name') | list }}"
      - name: "RasPi4 Services Checked"
        unique_id: d77c874e-5ecf-5ba8-9b3b-9f0903e551b4
        availability: "{{ available }}"
        state: "{{ (health.services | default([]) | length) }}"
        icon: "mdi:playlist-check"
        state_class: measurement
      - name: "RasPi4 Containers Checked"
        unique_id: f11e079b-0ed8-5dd0-b459-edadb61198d8
        availability: "{{ available }}"
        state: "{{ (health.containers | default([]) | length) }}"
        icon: "mdi:docker"
        state_class: measurement
      - name: "RasPi4 CPU Utilization"
        unique_id: 5d17f155-69e7-5aab-b501-f3282d03bbb4
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_pct | default(0)) | round(1) }}"
        icon: "mdi:chip"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "RasPi4 CPU Load 1m"
        unique_id: 8a1a8ffc-3684-5634-856b-ba13f20b7aed
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_1m | default(0)) | round(2) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "RasPi4 CPU Load 5m"
        unique_id: 21ab7a87-dcd9-5536-8467-da1728198a97
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_5m | default(0)) | round(2) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "RasPi4 CPU Load 15m"
        unique_id: c2749962-c8fb-5bc6-a421-a0d0755e2657
        availability: "{{ available }}"
        state: "{{ (cpus[0].load_15m | default(0)) | round(2) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "RasPi4 CPU Temp"
        unique_id: 3e868ce7-4e4d-5af1-842a-a663957a65c6
        availability: "{{ available }}"
        state: "{{ (cpus[0].temp_c | default(0)) | round(1) }}"
        unit_of_measurement: "°C"
        state_class: measurement
        device_class: temperature
      - name: "RasPi4 CPU Physical Cores"
        unique_id: d5338b9d-2b89-5b80-b9a5-a83be479cd96
        availability: "{{ available }}"
        state: "{{ cpus[0].num_physical_cores | default(0) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "RasPi4 CPU Logical Cores"
        unique_id: f47f5e81-ec6d-58da-801f-9b95c66595be
        availability: "{{ available }}"
        state: "{{ cpus[0].num_logical_cores | default(0) }}"
        icon: "mdi:chip"
        state_class: measurement
      - name: "RasPi4 Memory Percent"
        unique_id: 3f9fc895-32be-557b-880a-b2e7604b3cf7
        availability: "{{ available }}"
        state: "{{ (memory.system.load_pct | default(0)) | round(1) }}"
        icon: "mdi:memory"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "RasPi4 Memory Used"
        unique_id: 4c5c15ce-f4a9-5298-a711-02bab64a6c8a
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.used_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 Memory Available"
        unique_id: 42db4c9a-55c2-531e-9207-007e6c1df21a
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.available_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 Memory Total"
        unique_id: 6e872c2b-17f8-54b8-ae15-bb4a44811203
        availability: "{{ available }}"
        state: >-
          {{ ((memory.system.total_b | default(0)) / 1073741824) | round(2) }}
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 Swap Percent"
        unique_id: 953e7b59-411c-5d99-a6c7-5fbb14ae2c58
        availability: "{{ available }}"
        state: "{{ (memory.virtual.load_pct | default(0)) | round(1) }}"
        icon: "mdi:memory"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "RasPi4 FS Root Percent"
        unique_id: 27441c86-650b-575a-a8ac-123067ff4835
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('label', 'eq', 'rootfs') | first | default(none) %}{{ ((fs.used_b / (fs.used_b + fs.available_b)) * 100) | round(1) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "RasPi4 FS Root Used"
        unique_id: 7802b1c6-db84-56ce-9cf6-242e051481e4
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('label', 'eq', 'rootfs') | first | default(none) %}{{ ((fs.used_b | default(0)) / 1073741824) | round(2) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 FS Root Total"
        unique_id: d16e7c21-26ff-5244-a2ee-067ce2c2f9f2
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('label', 'eq', 'rootfs') | first | default(none) %}{{ (((fs.used_b | default(0)) + (fs.available_b | default(0))) / 1073741824) | round(2) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 FS Boot Percent"
        unique_id: af9e369e-235d-5d09-a447-c1ee1ea9a66a
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('label', 'eq', 'bootfs') | first | default(none) %}{{ ((fs.used_b / (fs.used_b + fs.available_b)) * 100) | round(1) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "%"
        state_class: measurement
      - name: "RasPi4 FS Boot Used"
        unique_id: 4d8341b2-e2fe-5825-a934-0a06b1df27d6
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('label', 'eq', 'bootfs') | first | default(none) %}{{ ((fs.used_b | default(0)) / 1073741824) | round(2) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 FS Boot Total"
        unique_id: f89cc1de-9266-5373-8deb-e9a89a725efa
        availability: "{{ available }}"
        state: >-
          {% set fs = filesystems | selectattr('label', 'eq', 'bootfs') | first | default(none) %}{{ (((fs.used_b | default(0)) + (fs.available_b | default(0))) / 1073741824) | round(2) if fs else 0 }}
        icon: "mdi:harddisk"
        unit_of_measurement: "GiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 Ethernet Upload"
        unique_id: aa4e5a4c-1e54-5bda-a8ae-e27b87baabfb
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ (iface.rate_up_bps | default(0)) | round(0) if iface else 0 }}
        icon: "mdi:upload"
        unit_of_measurement: "B/s"
        device_class: data_rate
      - name: "RasPi4 Ethernet Download"
        unique_id: 818b09f2-d8b2-5ecf-80a9-9abae7cab5a2
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ (iface.rate_down_bps | default(0)) | round(0) if iface else 0 }}
        icon: "mdi:download"
        unit_of_measurement: "B/s"
        device_class: data_rate
      - name: "RasPi4 Ethernet IPv4"
        unique_id: fc89242e-7c8d-5177-b507-3f36b6ce9e55
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.ipv4 | default('unknown') if iface else 'unknown' }}
      - name: "RasPi4 Ethernet Info"
        unique_id: 896b9f37-87b6-5169-80cd-f15095cb55fd
        availability: "{{ available }}"
        state: >-
          {% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.name | default('Unknown') if iface else 'Unknown' }}
        icon: "mdi:ethernet"
        attributes:
          name: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.name | default('Unknown') if iface else 'Unknown' }}"
          mac: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.mac | default('Unknown') if iface else 'Unknown' }}"
          ipv4: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.ipv4 | default('None') if iface else 'None' }}"
          ipv6: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.ipv6 | default('None') if iface else 'None' }}"
          link_speed_mbps: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.link_speed_mbps | default(0) if iface else 0 }}"
          duplex: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.duplex | default('unknown') if iface else 'unknown' }}"
          mtu: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.mtu | default(0) if iface else 0 }}"
          carrier: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.carrier | default(false) if iface else false }}"
          driver: "{% set iface = ifaces | selectattr('name', 'eq', 'eth0') | first | default(none) %}{{ iface.driver | default('Unknown') if iface else 'Unknown' }}"
      - name: "RasPi4 Throttling Status"
        unique_id: 63e1522e-c503-5a61-a26a-d745187acb4f
        availability: "{{ available }}"
        state: >-
          {{ 'Throttled' if (throttling.currently_throttled | default(false)) else 'OK' }}
        icon: "mdi:speedometer-slow"
        attributes:
          undervoltage: "{{ throttling.undervoltage | default(false) }}"
          arm_freq_capped: "{{ throttling.arm_freq_capped | default(false) }}"
          currently_throttled: "{{ throttling.currently_throttled | default(false) }}"
          soft_temp_limit: "{{ throttling.soft_temp_limit | default(false) }}"
          undervoltage_occurred: "{{ throttling.undervoltage_occurred | default(false) }}"
          arm_freq_cap_occurred: "{{ throttling.arm_freq_cap_occurred | default(false) }}"
          throttle_occurred: "{{ throttling.throttle_occurred | default(false) }}"
          soft_temp_limit_occurred: "{{ throttling.soft_temp_limit_occurred | default(false) }}"
      - name: "RasPi4 ARM Memory"
        unique_id: 0ab59d6f-e6c8-5e8b-bb4f-ff598795d251
        availability: "{{ available }}"
        state: >-
          {{ ((sbc.arm_mem_b | default(0)) / 1048576) | round(0) | int }}
        icon: "mdi:memory"
        unit_of_measurement: "MiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 GPU Memory"
        unique_id: e321d42a-ea29-5854-a88f-6539815b4f58
        availability: "{{ available }}"
        state: >-
          {{ ((sbc.gpu_mem_b | default(0)) / 1048576) | round(0) | int }}
        icon: "mdi:memory"
        unit_of_measurement: "MiB"
        state_class: measurement
        device_class: data_size
      - name: "RasPi4 Core Voltage"
        unique_id: cc83d946-8919-5be5-9842-67d0e337c147
        availability: "{{ available }}"
        state: >-
          {{ ((sbc.voltages | default({})).core_v | default(0)) | round(2) }}
        icon: "mdi:flash"
        unit_of_measurement: "V"
        state_class: measurement
        device_class: voltage
      - name: "RasPi4 ARM Clock"
        unique_id: d5245d13-2af3-5d80-ac41-f073fcdab4cb
        availability: "{{ available }}"
        state: >-
          {{ (((sbc.clocks | default({})).arm_hz | default(0)) / 1000000) | round(0) | int }}
        icon: "mdi:sine-wave"
        unit_of_measurement: "MHz"
        state_class: measurement
        device_class: frequency
      - name: "RasPi4 NTP Reference"
        unique_id: ecd5235f-ff14-51dc-aa85-529361ed8a42
        availability: "{{ available }}"
        state: >-
          {{ (time_server.tracking | default({})).reference_name | default('unknown') }}
        icon: "mdi:clock-check"
      - name: "RasPi4 NTP Stratum"
        unique_id: 24eab8ec-5a03-51c8-ab3b-4c9a7dc0fb25
        availability: "{{ available }}"
        state: >-
          {{ (time_server.tracking | default({})).stratum | default(0) }}
        icon: "mdi:layers"
        state_class: measurement
      - name: "RasPi4 Time Offset"
        unique_id: 2b5c61f8-26ef-552e-b86e-29dcfb3127ab
        availability: "{{ available }}"
        state: >-
          {{ (((time_server.tracking | default({})).system_time_offset_s | default(0)) * 1000000) | round(3) }}
        icon: "mdi:clock-alert"
        unit_of_measurement: "µs"
        state_class: measurement
        device_class: duration
      - name: "RasPi4 RMS Offset"
        unique_id: 83f49345-316d-54a8-a7f0-c804275d43a0
        availability: "{{ available }}"
        state: >-
          {{ (((time_server.tracking | default({})).rms_offset_s | default(0)) * 1000000) | round(3) }}
        icon: "mdi:chart-line-variant"
        unit_of_measurement: "µs"
        state_class: measurement
        device_class: duration
      - name: "RasPi4 Frequency Offset"
        unique_id: d1ff059e-012b-512c-8c67-c98fe6fb6628
        availability: "{{ available }}"
        state: >-
          {{ ((time_server.tracking | default({})).frequency_ppm | default(0)) | round(3) }}
        icon: "mdi:sine-wave"
        unit_of_measurement: "ppm"
        state_class: measurement
      - name: "RasPi4 Leap Status"
        unique_id: e2c7939b-7f94-5852-947d-9288c67df1ab
        availability: "{{ available }}"
        state: >-
          {{ (time_server.tracking | default({})).leap_status | default('Normal') }}
        icon: "mdi:clock-fast"
      - name: "RasPi4 GPS Mode"
        unique_id: c3a84091-391b-5e56-b837-563cb44d864b
        availability: "{{ available }}"
        state: >-
          {{ {0: 'No Fix', 1: 'No Fix', 2: '2D', 3: '3D'}.get((time_server.gps | default({})).mode | default(0), 'Unknown') }}
        icon: "mdi:crosshairs-gps"
        device_class: enum
        attributes:
          mode_text: "{{ {0: 'No Fix', 1: 'No Fix', 2: '2D', 3: '3D'}.get((time_server.gps | default({})).mode | default(0), 'Unknown') }}"
      - name: "RasPi4 GPS Status"
        unique_id: 6423c962-20f0-5a96-9ead-37386667763a
        availability: "{{ available }}"
        state: >-
          {{ {0: 'Unknown', 1: 'Normal', 2: 'DGPS', 3: 'RTK Fixed', 4: 'RTK Float', 5: 'Dead Reckoning'}.get((time_server.gps | default({})).status | default(0), 'Unknown') }}
        icon: "mdi:satellite-variant"
        device_class: enum
        attributes:
          status_text: "{{ {0: 'Unknown', 1: 'Normal', 2: 'DGPS', 3: 'RTK Fixed', 4: 'RTK Float', 5: 'Dead Reckoning'}.get((time_server.gps | default({})).status | default(0), 'Unknown') }}"
      - name: "RasPi4 GPS Satellites Visible"
        unique_id: defe55ec-5ce8-56bb-9e8c-421fde3b699f
        availability: "{{ available }}"
        state: >-
          {{ (time_server.gps | default({})).satellites_visible | default(0) }}
        icon: "mdi:satellite-variant"
        state_class: measurement
      - name: "RasPi4 GPS Satellites Used"
        unique_id: ff8ca9f3-f5d8-5a42-b657-26c221a2aa04
        availability: "{{ available }}"
        state: >-
          {{ (time_server.gps | default({})).satellites_used | default(0) }}
        icon: "mdi:satellite-variant"
        state_class: measurement
      - name: "RasPi4 GPS HDOP"
        unique_id: a968f856-91af-521e-8da0-517ca86786dd
        availability: "{{ available }}"
        state: >-
          {{ ((time_server.gps | default({})).hdop | default(99)) | round(2) }}
        icon: "mdi:crosshairs-question"
        state_class: measurement
      - name: "RasPi4 GPS Latitude"
        unique_id: 80f6eec8-2594-585d-9ad2-c2bb906b61e4
        availability: "{{ available }}"
        state: >-
          {{ ((time_server.gps | default({})).latitude | default(0)) | round(6) }}
        icon: "mdi:latitude"
        unit_of_measurement: "°"
        state_class: measurement
      - name: "RasPi4 GPS Longitude"
        unique_id: d2fa03fd-428f-5525-be34-5468a0fa1c5a
        availability: "{{ available }}"
        state: >-
          {{ ((time_server.gps | default({})).longitude | default(0)) | round(6) }}
        icon: "mdi:longitude"
        unit_of_measurement: "°"
        state_class: measurement
      - name: "RasPi4 NTP Packets Received"
        unique_id: ef8780d5-f594-5a8f-b1fa-67dc48b67ae0
        availability: "{{ available }}"
        state: >-
          {{ (time_server.server_stats | default({})).ntp_packets_received | default(0) }}
        icon: "mdi:counter"
        state_class: total_increasing
      - name: "RasPi4 NTP Client Count"
        unique_id: 669a9e8a-71e6-54ae-8386-7fb935f111c3
        availability: "{{ available }}"
        state: >-
          {{ (time_server.server_stats | default({})).client_count | default(0) }}
        icon: "mdi:account-multiple"
        state_class: measurement
    binary_sensor:
      - name: "RasPi4 Overall Status OK"
        unique_id: 1b67a24f-715e-59dc-b2ef-636f4f79bff2
        availability: "{{ available }}"
        state: "{{ health.overall_ok | default(false) }}"
        icon: "mdi:check-circle"
      - name: "RasPi4 Status Alarm"
        unique_id: 72b19030-a6b2-5cdd-a4d4-8e0b8383410e
        availability: "{{ available }}"
        state: "{{ not (health.overall_ok | default(true)) }}"
        device_class: problem
      - name: "RasPi4 Services OK"
        unique_id: d50df495-b5df-584e-9712-e67b41f98601
        availability: "{{ available }}"
        state: >-
          {% set tracked = ['chrony', 'gpsd', 'str2str-ntrip'] %}{% set svc_list = health.services | default([]) %}{{ svc_list | selectattr('name', 'in', tracked) | selectattr('ok', 'eq', false) | list | length == 0 }}
        icon: "mdi:check-circle"
      - name: "RasPi4 Display Services"
        unique_id: b88e1818-14eb-5200-aba9-0ec8884bd327
        availability: "{{ available }}"
        state: >-
          {% set tracked = ['chrony', 'gpsd', 'str2str-ntrip'] %}{% set svc_list = health.services | default([]) %}{{ svc_list | selectattr('name', 'in', tracked) | selectattr('ok', 'eq', false) | list | length > 0 }}
        icon: "mdi:cog-off"
