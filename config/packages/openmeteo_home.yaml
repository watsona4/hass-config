automation:
  - alias: "OpenMeteo Home"
    id: dd40bc1f-f54e-4dfc-9da0-d62859e2c558
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    conditions:
      - condition: template
        value_template: >-
          {%- from 'macros/rest_helpers.jinja' import home_is_valid -%}
          {{ home_is_valid() | bool }}
    action:
      - delay:
          seconds: "{{ range(0, 900) | random | int }}"
      - service: rest_command.openmeteo_home_fetch
        response_variable: resp
      - variables:
          ok: "{{ resp is mapping and (resp.status | int(0)) == 200 }}"
          parsed_obj: >-
            {{ resp.content if resp is mapping and resp.content is mapping
                else (resp.content | default('') | string | from_json(default={})) }}
      - event: openmeteo_home_update
        event_data:
          available: "{{ ok }}"
          parsed: "{{ parsed_obj | tojson }}"
