# =====================================================================================
# OpenMeteo Home - Weather data for primary residence
#
# Fetches forecast data from Open-Meteo API every 15 minutes with random jitter.
# Location coordinates come from macros/rest_helpers.jinja (home_lat, home_lon, home_alt).
#
# Entities created:
#   - weather.openmeteo_weather_home: Full weather entity with current + forecast
#   - sensor.openmeteo_home: Raw API data (temperature state, full response in attributes)
#   - sensor.openmeteo_home_temperature: Current temperature
#   - sensor.openmeteo_home_apparent_temperature: Feels-like temperature
#   - sensor.openmeteo_home_humidity: Relative humidity
#   - sensor.openmeteo_home_dew_point: Dew point temperature
#   - sensor.openmeteo_home_uv_index: Current UV index
#   - sensor.openmeteo_home_wind_*: Wind speed, gust, direction
#   - sensor.openmeteo_home_*_uv_index_max: Today/tomorrow/day2 max UV forecasts
#   - sensor.openmeteo_home_today_precip_*: Precipitation sum and probability
#   - binary_sensor.openmeteo_home_uv_protection: True when UV exceeds 3.5 threshold
#   - sensor.openmeteo_home_safe_exposure_*_st[1-6]: Safe sun exposure by skin type
#
# Jinja dependencies:
#   - macros/rest_helpers.jinja: Location coordinate macros
#   - metrics/weather/forecasts.jinja: Condition mapping and forecast formatting
#   - metrics/uv/protection_window.jinja: UV threshold time window calculation
#   - metrics/uv/exposure_st.jinja: Safe exposure time by Fitzpatrick skin type
# =====================================================================================

rest_command:
  openmeteo_home_fetch:
    url: >-
      {%- from 'macros/rest_helpers.jinja' import home_lat, home_lon, home_alt -%}
      https://api.open-meteo.com/v1/forecast?latitude={{ home_lat() }}&longitude={{ home_lon() }}&elevation={{ home_alt() }}&timezone=auto&current=apparent_temperature,cloud_cover,dew_point_2m,is_day,relative_humidity_2m,surface_pressure,temperature_2m,uv_index,visibility,weather_code,wind_direction_10m,wind_gusts_10m,wind_speed_10m&daily=precipitation_probability_max,precipitation_sum,rain_sum,snowfall_sum,sunrise,sunset,temperature_2m_max,temperature_2m_min,uv_index_max,weather_code,wind_gusts_10m_max,wind_direction_10m_dominant,wind_speed_10m_max&hourly=apparent_temperature,cloud_cover,dew_point_2m,is_day,precipitation,precipitation_probability,relative_humidity_2m,surface_pressure,temperature_2m,uv_index,weather_code,wind_direction_10m,wind_gusts_10m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&forecast_hours=24
    method: GET
    timeout: 60
    headers:
      Accept: application/json
      User-Agent: HomeAssistant
      Cache-Control: no-cache

template:

  - weather:
      - name: "OpenMeteo Weather Home"
        unique_id: 042b6cfb-61b6-476d-b99c-2320f04d3ddc
        availability: "{{ has_value('sensor.openmeteo_home') }}"
        condition_template: >
          {%- from 'metrics/weather/forecasts.jinja' import current_condition -%}
          {{- current_condition('sensor.openmeteo_home') -}}
        apparent_temperature_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('apparent_temperature') -}}"
        cloud_coverage_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('cloud_cover') -}}"
        dew_point_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('dew_point_2m') -}}"
        humidity_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('relative_humidity_2m') -}}"
        pressure_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('surface_pressure') -}}"
        temperature_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('temperature_2m') -}}"
        visibility_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('visibility') -}}"
        wind_bearing_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('wind_direction_10m') -}}"
        wind_gust_speed_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('wind_gusts_10m') -}}"
        wind_speed_template: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('wind_speed_10m') -}}"
        precipitation_unit: "in"
        pressure_unit: "hPa"
        temperature_unit: "°F"
        visibility_unit: "m"
        wind_speed_unit: "mph"
        forecast_daily_template: >
          {%- from 'metrics/weather/forecasts.jinja' import forecast_daily -%}
          {{- forecast_daily('sensor.openmeteo_home') | from_json(default={}) -}}
        forecast_hourly_template: >
          {%- from 'metrics/weather/forecasts.jinja' import forecast_hourly -%}
          {{- forecast_hourly('sensor.openmeteo_home') | from_json(default={}) -}}

  - trigger:
      - platform: event
        event_type: openmeteo_home_update
    sensor:
      - name: "OpenMeteo Home"
        unique_id: d802ddd7-d054-496a-9946-b45efbbcea66
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        availability: >-
          {{ trigger is not none
             and trigger.event is not none
             and trigger.event.data is mapping
             and (trigger.event.data.available | default(false)) }}
        state: >-
          {%- set data = trigger.event.data.parsed if trigger and trigger.event and trigger.event.data.parsed is mapping else {} -%}
          {%- set cur = data.get('current') or {} -%}
          {%- set t = cur.get('temperature_2m') -%}
          {{ t if t is not none else states(this.entity_id) }}
        attributes:
          timezone: "{{ trigger.event.data.parsed.timezone if trigger else none }}"
          timezone_abbreviation: "{{ trigger.event.data.parsed.timezone_abbreviation if trigger else none }}"
          elevation: "{{ trigger.event.data.parsed.elevation if trigger else none }}"
          current_units: "{{ trigger.event.data.parsed.current_units if trigger else none }}"
          current: "{{ trigger.event.data.parsed.current if trigger else none }}"
          hourly_units: "{{ trigger.event.data.parsed.hourly_units if trigger else none }}"
          hourly: "{{ trigger.event.data.parsed.hourly if trigger else none }}"
          daily_units: "{{ trigger.event.data.parsed.daily_units if trigger else none }}"
          daily: "{{ trigger.event.data.parsed.daily if trigger else none }}"

  - sensor:
      - name: "OpenMeteo Home Temperature"
        unique_id: ade2d15d-f5ff-4e2f-b973-bc7080f295cb
        device_class: temperature
        unit_of_measurement: "°F"
        availability: "{{- has_value('sensor.openmeteo_home') and (state_attr('sensor.openmeteo_home','current') is mapping) -}}"
        state: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('temperature_2m') -}}"
      - name: "OpenMeteo Home UV Index"
        unique_id: 5d685b20-1f51-42ba-ac84-59668826498b
        state_class: measurement
        availability: "{{- has_value('sensor.openmeteo_home') and (state_attr('sensor.openmeteo_home','current') is mapping) -}}"
        state: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('uv_index') -}}"
      - name: "OpenMeteo Home Apparent Temperature"
        unique_id: 64eec5d3-40d0-42e1-85e5-f1c892aaa0dd
        device_class: temperature
        unit_of_measurement: "°F"
        availability: "{{- has_value('sensor.openmeteo_home') and (state_attr('sensor.openmeteo_home','current') is mapping) -}}"
        state: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('apparent_temperature') -}}"
      - name: "OpenMeteo Home Humidity"
        unique_id: b458975e-526a-40b1-96a1-b1c6a5e5d7b6
        device_class: humidity
        unit_of_measurement: "%"
        availability: "{{- has_value('sensor.openmeteo_home') and (state_attr('sensor.openmeteo_home','current') is mapping) -}}"
        state: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('relative_humidity_2m') -}}"
      - name: "OpenMeteo Home Dew Point"
        unique_id: 3ef111ee-09ca-4514-ad9f-19f33c0d48ec
        device_class: temperature
        unit_of_measurement: "°F"
        availability: "{{- has_value('sensor.openmeteo_home') and (state_attr('sensor.openmeteo_home','current') is mapping) -}}"
        state: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('dew_point_2m') -}}"
      - name: "OpenMeteo Home Wind Speed"
        unique_id: ffff269d-6693-4fdf-800b-80b14e11fa18
        device_class: wind_speed
        unit_of_measurement: "mph"
        availability: "{{- has_value('sensor.openmeteo_home') and (state_attr('sensor.openmeteo_home','current') is mapping) -}}"
        state: "{{- (state_attr('sensor.openmeteo_home','current') or {}).get('wind_speed_10m') -}}"
      - name: "OpenMeteo Home Wind Gust"
