  - sensor:
      - name: "OpenMeteo Home UV Window JSON"
        unique_id: 8f55b224-b5f6-4f33-962c-c49f85bc0c31
        icon: mdi:code-json
        availability: "{{- has_value('sensor.openmeteo_home') -}}"
        state: "{{- now () -}}"
        attributes:
          data: >-
            {%- from 'metrics/uv/protection_window.jinja' import uv_window -%}
            {{- uv_window('sensor.openmeteo_home', 3.5) | from_json(default={}) -}}

  - binary_sensor:
      - name: "OpenMeteo Home UV Protection"
        unique_id: 86f73332-61f4-4d2b-be91-952438390ac4
        availability: "{{- has_value('sensor.openmeteo_home_uv_window_json') -}}"
        state: >-
          {%- set window = state_attr('sensor.openmeteo_home_uv_window_json','data') -%}
          {%- set s = window.get('start') | as_datetime(default=None) -%}
          {%- set e = window.get('end') | as_datetime(default=None) -%}
          {{- s is not none and e is not none and s | as_local <= now() < e | as_local -}}
        attributes:
          start: >-
            {%- set window = state_attr('sensor.openmeteo_home_uv_window_json','data') -%}
            {%- set dt = window.get('start') | as_datetime(default=none) -%}
            {{- dt | as_local if dt is not none -}}
          end: >-
            {%- set window = state_attr('sensor.openmeteo_home_uv_window_json','data') -%}
            {%- set dt = window.get('end') | as_datetime(default=none) -%}
            {{- dt | as_local if dt is not none -}}
          duration: >-
            {%- set window = state_attr('sensor.openmeteo_home_uv_window_json','data') -%}
            {{- timedelta(minutes=window.get('duration_min') | int(0)) -}}
          active: >-
            {%- set window = state_attr('sensor.openmeteo_home_uv_window_json','data') -%}
            {{- window.get('active') | bool(none) -}}
          ever_above: >-
            {%- set window = state_attr('sensor.openmeteo_home_uv_window_json','data') -%}
            {{- window.get('ever_above') | bool(none) -}}

