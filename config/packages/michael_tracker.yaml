# ======================= Michael Presence (Backpack-first) =======================
# Purpose: Accurate "NOT HOME" even if iPad remains at home.
# Strategy:
#   - "Home" if backpack beacon recently seen (primary) OR short grace after door entry.
#   - "Away" if beacon absent for a while AND no recent motion in his room.
#   - iPad is ignored for away, used only to refine location when backpack is home.
#   - If backpack state is unknown, the virtual tracker is set to 'unknown'.

# ------------------------------ CONFIGURE ENTITIES ------------------------------
# Backpack BLE presence (iBeacon tracker integration):
#   device_tracker.michael_tracker
# Motion in Michael's room (ESPHome mmWave sensor):
#   binary_sensor.michael_presence_presence_information
# Front door contact (for brief arrival grace):
#   binary_sensor.kitchen_door_contact
# iPad tracker (for GPS/state pass-through when not home):
#   device_tracker.icloud3_michaels_ipad

# ------------------------- Helpers --------------------
input_datetime:
  michael_school_check_start:
    name: Michael School Check Start
    has_date: false
    has_time: true
    initial: "14:30:00"
  michael_school_check_end:
    name: Michael School Check End
    has_date: false
    has_time: true
    initial: "17:30:00"
  # Track last time presence was detected (for hysteresis)
  michael_last_home_time:
    name: Michael Last Home Time
    has_date: true
    has_time: true

template:
  - trigger:
      - platform: state
        entity_id:
          - device_tracker.michael_tracker
          - binary_sensor.michael_presence_presence_information
          - binary_sensor.kitchen_door_contact
          - device_tracker.icloud3_michaels_ipad
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
    variables:
      # Entities
      ent_beacon: device_tracker.michael_tracker
      ent_motion: binary_sensor.michael_presence_presence_information
      ent_door: binary_sensor.kitchen_door_contact
      ent_ipad: device_tracker.icloud3_michaels_ipad

      # Raw states
      beacon_state: "{{ states(ent_beacon) }}"
      beacon_available: "{{ beacon_state not in ['unavailable', 'unknown'] and beacon_state is not none }}"
      beacon_on: "{{ is_state(ent_beacon, 'home') }}"
      motion_on: "{{ is_state(ent_motion, 'on') }}"
      door_open: "{{ is_state(ent_door, 'on') if has_value(ent_door) else false }}"
      now_ts: "{{ now() | as_timestamp }}"

      # Tunables
      beacon_recent_minutes: 10
      arrival_door_grace_min: 5
      beacon_absence_minutes: 15
      motion_recent_minutes: 15
      hysteresis_minutes: 5

      # Last-seen for beacon (fallback to last_changed if no attribute)
      beacon_last_seen_ts: >-
        {%- set ls = state_attr(ent_beacon, 'last_seen') -%}
        {%- if ls is not none -%}
          {{ ls | as_datetime | as_timestamp }}
        {%- elif states[ent_beacon] is defined -%}
          {{ states[ent_beacon].last_changed | as_timestamp }}
        {%- else -%}
          {{ none }}
        {%- endif -%}
      beacon_last_seen_age_m: >-
        {{ ((now_ts - beacon_last_seen_ts) / 60) if beacon_last_seen_ts is number else 9999 }}

      # Motion recency (fallback when beacon unavailable)
      motion_off_age_m: >-
        {%- if motion_on -%}
          0
        {%- elif states[ent_motion] is defined -%}
          {{ (now_ts - (states[ent_motion].last_changed | as_timestamp)) / 60 }}
        {%- else -%}
          9999
        {%- endif -%}
      motion_recent: "{{ motion_off_age_m | float(9999) <= motion_recent_minutes }}"

      # Door grace: home briefly right after opening (arrival)
      door_last_open_ts: >-
        {{ (states[ent_door].last_changed | as_timestamp) if has_value(ent_door) and states[ent_door] is defined else none }}
      door_grace_active: >-
        {{ door_last_open_ts is number and ((now_ts - door_last_open_ts) / 60 <= arrival_door_grace_min) }}

      # Presence rules
      # Primary: backpack beacon (when available)
      present_via_beacon: >-
        {{ beacon_on or (beacon_last_seen_age_m | float(9999) <= beacon_recent_minutes) }}
      beacon_definitely_away: >-
        {{ beacon_available and beacon_last_seen_age_m | float(9999) >= beacon_absence_minutes }}

      # Fallback: motion in room (when beacon unavailable)
      present_via_motion_fallback: >-
        {{ (not beacon_available) and motion_recent }}

      # Door grace (arrival window)
      present_via_grace: "{{ door_grace_active }}"

      # Final home/away determination
      # Home if: beacon present, OR door grace, OR (beacon unavailable AND motion recent)
      is_home: >-
        {{ present_via_beacon or present_via_grace or present_via_motion_fallback }}

      # Away if: beacon is available AND definitely away
      # (If beacon unavailable, we rely on motion fallback above)
      is_away: "{{ beacon_definitely_away and not motion_recent }}"

      # Hysteresis: check if we were recently home (within hysteresis window)
      last_home_ts: >-
        {{ states('input_datetime.michael_last_home_time') | as_datetime | as_timestamp if has_value('input_datetime.michael_last_home_time') else 0 }}
      recently_home: >-
        {{ (now_ts - last_home_ts) / 60 <= hysteresis_minutes if last_home_ts else false }}

      # Backpack state for downstream use
      # When beacon unavailable, use motion as fallback to determine state
      backpack_state: >-
        {%- if not beacon_available -%}
          {%- if motion_recent -%}
            home
          {%- else -%}
            unknown
          {%- endif -%}
        {%- elif present_via_beacon -%}
          home
        {%- elif beacon_definitely_away -%}
          away
        {%- else -%}
          unknown
        {%- endif -%}

    binary_sensor:
      - name: Michael Home (Backpack-first)
        unique_id: michael_home_backpack_first
        device_class: presence
        availability: "{{ has_value(ent_beacon) or has_value(ent_motion) }}"
        state: >-
          {%- if is_home -%}
            on
          {%- elif is_away and not recently_home -%}
            off
          {%- elif this.state in ['on', 'off'] -%}
            {{ this.state }}
          {%- else -%}
            off
          {%- endif -%}
        attributes:
          backpack_state: "{{ backpack_state }}"
          beacon_available: "{{ beacon_available }}"
          beacon_on: "{{ beacon_on }}"
          beacon_last_seen_minutes: "{{ beacon_last_seen_age_m | round(1) if beacon_last_seen_age_m | float(9999) < 9999 else 'unknown' }}"
          motion_recent: "{{ motion_recent }}"
          motion_fallback_active: "{{ present_via_motion_fallback }}"
          door_grace_active: "{{ door_grace_active }}"
          recently_home: "{{ recently_home }}"
          ipad_state: "{{ states(ent_ipad) }}"
          is_home: "{{ is_home }}"
          is_away: "{{ is_away }}"

    sensor:
      - name: Michael School Check Window Active
        unique_id: michael_school_check_window_active
        icon: mdi:clock
        state: >-
          {%- set s = states('input_datetime.michael_school_check_start') | as_datetime -%}
          {%- set e = states('input_datetime.michael_school_check_end') | as_datetime -%}
          {%- if s and e -%}
            {%- set nowt = now() -%}
            {%- set start = nowt.replace(hour=s.hour, minute=s.minute, second=s.second, microsecond=0) -%}
            {%- set end = nowt.replace(hour=e.hour, minute=e.minute, second=e.second, microsecond=0) -%}
            {{ 'on' if start <= nowt <= end else 'off' }}
          {%- else -%}
            off
          {%- endif -%}

automation:
  # Update last home time when presence is detected (for hysteresis)
  - id: michael_update_last_home_time
    alias: "Michael: Update last home time"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.michael_home_backpack_first
        to: "on"
    action:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.michael_last_home_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: michael_away_alert_school_window
    alias: "Michael: Away during school return window"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.michael_home_backpack_first
        to: "off"
    condition:
      - condition: state
        entity_id: sensor.michael_school_check_window_active
        state: "on"
    action:
      - service: notify.aaron_and_ashley_phones
        data:
          title: "Michael is not home"
          message: >-
            Michael is away during the school return window.
            (Backpack last seen {{ state_attr('binary_sensor.michael_home_backpack_first', 'beacon_last_seen_minutes') }} min ago)
      - service: persistent_notification.create
        data:
          title: "Michael away (school window)"
          message: "Triggered away alert so you can check Find My."

  # ------------------ Virtual tracker: reflect your final rules ------------------
  # Logic:
  #   - Backpack home + iPad home = home
  #   - Backpack home + iPad away = follow iPad (he took iPad, left backpack)
  #   - Backpack away + iPad home = not_home (school scenario - iPad stays home)
  #   - Backpack away + iPad away = follow iPad (he's out with both)
  #   - Backpack unknown = unknown
  - alias: "Virtual tracker: Michael (backpack-first)"
    id: virtual_tracker_michael
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.michael_home_backpack_first
          - device_tracker.icloud3_michaels_ipad
    variables:
      ent_presence: binary_sensor.michael_home_backpack_first
      ent_ipad: device_tracker.icloud3_michaels_ipad
      backpack_state: "{{ state_attr(ent_presence, 'backpack_state') | default('unknown') }}"
      backpack_is_home: "{{ backpack_state == 'home' }}"
      backpack_is_away: "{{ backpack_state == 'away' }}"
      backpack_is_unknown: "{{ backpack_state == 'unknown' }}"
      ipad_state: "{{ states(ent_ipad) }}"
      ipad_is_home: "{{ ipad_state == 'home' }}"
      ipad_is_away: "{{ ipad_state not in ['home', 'unknown', 'unavailable'] }}"
      ipad_lat: "{{ state_attr(ent_ipad, 'latitude') }}"
      ipad_lon: "{{ state_attr(ent_ipad, 'longitude') }}"
      have_ipad_gps: "{{ ipad_lat is number and ipad_lon is number }}"
      accuracy: "{{ state_attr(ent_ipad, 'gps_accuracy') | int(100) }}"
    action:
      - choose:
          # Backpack unknown -> tracker unknown
          - conditions: "{{ backpack_is_unknown }}"
            sequence:
              - service: device_tracker.see
                data:
                  dev_id: michael_helper_tracker
                  location_name: unknown

          # Backpack away + iPad home -> not_home (school scenario)
          - conditions: "{{ backpack_is_away and ipad_is_home }}"
            sequence:
              - service: device_tracker.see
                data:
                  dev_id: michael_helper_tracker
                  location_name: not_home

          # Backpack away + iPad away -> follow iPad location
          - conditions: "{{ backpack_is_away and ipad_is_away }}"
            sequence:
              - if: "{{ have_ipad_gps }}"
                then:
                  - service: device_tracker.see
                    data:
                      dev_id: michael_helper_tracker
                      gps:
                        - "{{ ipad_lat }}"
                        - "{{ ipad_lon }}"
                      gps_accuracy: "{{ accuracy }}"
                      source_type: gps
                else:
                  - service: device_tracker.see
                    data:
                      dev_id: michael_helper_tracker
                      location_name: "{{ ipad_state }}"

          # Backpack home + iPad away -> follow iPad location (he took iPad, left backpack)
          - conditions: "{{ backpack_is_home and ipad_is_away }}"
            sequence:
              - if: "{{ have_ipad_gps }}"
                then:
                  - service: device_tracker.see
                    data:
                      dev_id: michael_helper_tracker
                      gps:
                        - "{{ ipad_lat }}"
                        - "{{ ipad_lon }}"
                      gps_accuracy: "{{ accuracy }}"
                      source_type: gps
                else:
                  - service: device_tracker.see
                    data:
                      dev_id: michael_helper_tracker
                      location_name: "{{ ipad_state }}"

          # Backpack home + iPad home -> home
          - conditions: "{{ backpack_is_home and ipad_is_home }}"
            sequence:
              - service: device_tracker.see
                data:
                  dev_id: michael_helper_tracker
                  location_name: home

        # Fallback
        default:
          - service: device_tracker.see
            data:
              dev_id: michael_helper_tracker
              location_name: not_home
