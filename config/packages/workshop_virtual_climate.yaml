# ========================== Workshop Virtual Climate ===========================
# Purpose: Display-only climate entity for the workshop based on:
#  - Furnace running: detected via power sensor (dumb thermostat controlled)
#  - AC running: detected via power sensor (dumb thermostat controlled)
#  - Temperature: shop thermometer sensor
#
# Notes:
#  - Read-only climate entity - NO control capability
#  - Shows hvac_action: heating, cooling, or idle based on power consumption
#  - Mode reflects current operation, not a controllable setting
#  - Both HVAC units are controlled by independent dumb thermostats

# ------------------------------ THRESHOLDS ------------------------------------
# Power thresholds to detect when appliances are running
input_number:
  workshop_heater_run_w:
    name: Workshop Heater Running Threshold (W)
    min: 0
    max: 3000
    step: 5
    mode: box
    unit_of_measurement: W
    icon: mdi:fire
    initial: 50

  workshop_ac_run_w:
    name: Workshop AC Running Threshold (W)
    min: 0
    max: 3000
    step: 5
    mode: box
    unit_of_measurement: W
    icon: mdi:snowflake
    initial: 50

# --------------------------- TEMPLATE SENSORS ---------------------------------
template:
  - binary_sensor:
      # Furnace running state based on power consumption
      - name: Workshop Heater Running
        unique_id: workshop_heater_running
        device_class: running
        availability: "{{ has_value('sensor.shop_furnace_switch_0_power') }}"
        state: >
          {{ states('sensor.shop_furnace_switch_0_power')|float(0) >=
             states('input_number.workshop_heater_run_w')|float(50) }}
        icon: mdi:fire
        delay_off:
          seconds: 10

      # AC running state based on power consumption
      - name: Workshop AC Running
        unique_id: workshop_ac_running
        device_class: running
        availability: "{{ has_value('sensor.shop_air_conditioner_power') }}"
        state: >
          {{ states('sensor.shop_air_conditioner_power')|float(0) >=
             states('input_number.workshop_ac_run_w')|float(50) }}
        icon: mdi:snowflake
        delay_off:
          seconds: 10

  - sensor:
      # Pass-through temperature sensor
      - name: Workshop Temperature
        unique_id: workshop_temperature_passthrough
        device_class: temperature
        unit_of_measurement: "°F"
        availability: "{{ has_value('sensor.shop_thermometer_temperature') }}"
        state: "{{ states('sensor.shop_thermometer_temperature') }}"

      # Pass-through humidity sensor
      - name: Workshop Humidity
        unique_id: workshop_humidity_passthrough
        device_class: humidity
        unit_of_measurement: "%"
        availability: "{{ has_value('sensor.shop_thermometer_humidity') }}"
        state: "{{ states('sensor.shop_thermometer_humidity') }}"

# ------------------------------- MQTT CLIMATE ---------------------------------
# Read-only climate entity (no command topics = no control)
mqtt:
  climate:
    - name: Workshop HVAC
      unique_id: workshop_virtual_climate
      modes:
        - "off"
        - "heat"
        - "cool"
        - "heat_cool"
      # State topics only - no command topics makes it read-only
      mode_state_topic: "site/home/devices/workshop_hvac/mode"
      action_topic: "site/home/devices/workshop_hvac/action"
      current_temperature_topic: "site/home/devices/workshop_hvac/temperature"
      current_humidity_topic: "site/home/devices/workshop_hvac/humidity"
      temperature_unit: F
      availability:
        - topic: "site/home/devices/workshop_hvac/availability"

# ---------------------------- STATE PUBLISHING --------------------------------
automation:
  - id: workshop_virtual_hvac_publish_state
    alias: "Workshop Virtual HVAC: Publish State"
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.workshop_heater_running
          - binary_sensor.workshop_ac_running
          - sensor.shop_thermometer_temperature
          - sensor.shop_thermometer_humidity
      - platform: homeassistant
        event: start
    action:
      - variables:
          heater_on: "{{ is_state('binary_sensor.workshop_heater_running', 'on') }}"
          ac_on: "{{ is_state('binary_sensor.workshop_ac_running', 'on') }}"
          temp_available: "{{ has_value('sensor.shop_thermometer_temperature') }}"
          temp_f: "{{ states('sensor.shop_thermometer_temperature') | float(0) }}"
          humidity: "{{ states('sensor.shop_thermometer_humidity') | float(none) }}"
          # Mode reflects what's currently happening (not controllable)
          mode: >-
            {% if heater_on and ac_on %}heat_cool
            {% elif heater_on %}heat
            {% elif ac_on %}cool
            {% else %}off
            {% endif %}
          # Action shows the current HVAC activity
          action: >-
            {% if heater_on %}heating
            {% elif ac_on %}cooling
            {% elif temp_available %}idle
            {% else %}off
            {% endif %}
      # Publish availability
      - service: mqtt.publish
        data:
          topic: "site/home/devices/workshop_hvac/availability"
          payload: "{{ 'online' if temp_available else 'offline' }}"
          retain: true
      # Publish mode (reflects current operation)
      - service: mqtt.publish
        data:
          topic: "site/home/devices/workshop_hvac/mode"
          payload: "{{ mode }}"
          retain: true
      # Publish action
      - service: mqtt.publish
        data:
          topic: "site/home/devices/workshop_hvac/action"
          payload: "{{ action }}"
          retain: true
      # Publish temperature
      - if: "{{ temp_available }}"
        then:
          - service: mqtt.publish
            data:
              topic: "site/home/devices/workshop_hvac/temperature"
              payload: "{{ temp_f }}"
              retain: true
      # Publish humidity if available
      - if: "{{ humidity is not none and humidity | string != 'None' }}"
        then:
          - service: mqtt.publish
            data:
              topic: "site/home/devices/workshop_hvac/humidity"
              payload: "{{ humidity }}"
              retain: true

# -------------------------- RUNTIME STATISTICS --------------------------------
# Track daily heating/cooling run times
sensor:
  - platform: history_stats
    name: Workshop Heating Today
    entity_id: binary_sensor.workshop_heater_running
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: Workshop Cooling Today
    entity_id: binary_sensor.workshop_ac_running
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
