# =====================================================================================
# Ambient Weather (REST polling)
#
# Replacement for the core `ambient_station` integration, whose realtime websocket
# feed (aioambient -> rt2.ambientweather.net) stalls intermittently and freezes all
# values even while the station keeps uploading. This polls the Ambient REST API
# (api.ambientweather.net/v1/devices) every 60s for the same station ("Church Street",
# MAC 8C:4F:00:4F:FF:39) and exposes the fields as sensors.
#
# Credentials: secret `ambient_devices_url` (full URL incl. applicationKey + apiKey).
#
# Entities created:
#   - sensor.ambient_*            : outdoor/indoor weather, air quality, lightning, rain
#   - sensor.ambient_last_update  : station report time (freshness indicator)
#   - binary_sensor.ambient_weather_data_stale : on when last update > 10 min old
# =====================================================================================

rest:
  - resource: !secret ambient_devices_url
    scan_interval: 60
    timeout: 30
    headers:
      Accept: "application/json"
      User-Agent: "HomeAssistant"
      Cache-Control: "no-cache"
    sensor:

      - name: "Ambient Outdoor Temperature"
        unique_id: ambient_outdoor_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.tempf | float(none) }}

      - name: "Ambient Outdoor Humidity"
        unique_id: ambient_outdoor_humidity
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.humidity | float(none) }}

      - name: "Ambient Feels Like"
        unique_id: ambient_feels_like
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.feelsLike | float(none) }}

      - name: "Ambient Dew Point"
        unique_id: ambient_dew_point
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.dewPoint | float(none) }}

      - name: "Ambient Wind Speed"
        unique_id: ambient_wind_speed
        device_class: wind_speed
        state_class: measurement
        unit_of_measurement: "mph"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.windspeedmph | float(none) }}

      - name: "Ambient Wind Gust"
        unique_id: ambient_wind_gust
        device_class: wind_speed
        state_class: measurement
        unit_of_measurement: "mph"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.windgustmph | float(none) }}

      - name: "Ambient Max Daily Gust"
        unique_id: ambient_max_daily_gust
        device_class: wind_speed
        state_class: measurement
        unit_of_measurement: "mph"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.maxdailygust | float(none) }}

      - name: "Ambient Wind Direction"
        unique_id: ambient_wind_direction
        state_class: measurement
        unit_of_measurement: "°"
        icon: "mdi:compass-outline"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.winddir | float(none) }}

      - name: "Ambient Solar Radiation"
        unique_id: ambient_solar_radiation
        device_class: irradiance
        state_class: measurement
        unit_of_measurement: "W/m²"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.solarradiation | float(none) }}

      - name: "Ambient UV Index"
        unique_id: ambient_uv_index
        state_class: measurement
        icon: "mdi:weather-sunny-alert"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.uv | float(none) }}

      - name: "Ambient Relative Pressure"
        unique_id: ambient_relative_pressure
        device_class: pressure
        state_class: measurement
        unit_of_measurement: "inHg"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.baromrelin | float(none) }}

      - name: "Ambient Absolute Pressure"
        unique_id: ambient_absolute_pressure
        device_class: pressure
        state_class: measurement
        unit_of_measurement: "inHg"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.baromabsin | float(none) }}

      - name: "Ambient Indoor Temperature"
        unique_id: ambient_indoor_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.tempinf | float(none) }}

      - name: "Ambient Indoor Humidity"
        unique_id: ambient_indoor_humidity
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.humidityin | float(none) }}

      - name: "Ambient Indoor CO2"
        unique_id: ambient_indoor_co2
        device_class: carbon_dioxide
        state_class: measurement
        unit_of_measurement: "ppm"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.co2_in_aqin is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.co2_in_aqin | float(none) }}

      - name: "Ambient Indoor PM2.5"
        unique_id: ambient_indoor_pm25
        device_class: pm25
        state_class: measurement
        unit_of_measurement: "µg/m³"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.pm25_in_aqin is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.pm25_in_aqin | float(none) }}

      - name: "Ambient Outdoor PM2.5"
        unique_id: ambient_outdoor_pm25
        device_class: pm25
        state_class: measurement
        unit_of_measurement: "µg/m³"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.pm25 is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.pm25 | float(none) }}

      - name: "Ambient Outdoor AQI PM2.5"
        unique_id: ambient_outdoor_aqi_pm25
        device_class: aqi
        state_class: measurement
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.aqi_pm25 is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.aqi_pm25 | float(none) }}

      - name: "Ambient Lightning Strikes Today"
        unique_id: ambient_lightning_strikes_today
        state_class: total_increasing
        icon: "mdi:flash"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.lightning_day is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.lightning_day | int(none) }}

      - name: "Ambient Lightning Distance"
        unique_id: ambient_lightning_distance
        device_class: distance
        state_class: measurement
        unit_of_measurement: "mi"
        icon: "mdi:flash-alert"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.lightning_distance is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.lightning_distance | float(none) }}

      - name: "Ambient Hourly Rain"
        unique_id: ambient_hourly_rain
        device_class: precipitation_intensity
        state_class: measurement
        unit_of_measurement: "in/h"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.hourlyrainin | float(none) }}

      - name: "Ambient Daily Rain"
        unique_id: ambient_daily_rain
        device_class: precipitation
        state_class: total_increasing
        unit_of_measurement: "in"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.dailyrainin | float(none) }}

      - name: "Ambient Event Rain"
        unique_id: ambient_event_rain
        device_class: precipitation
        state_class: total_increasing
        unit_of_measurement: "in"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.eventrainin | float(none) }}

      - name: "Ambient Monthly Rain"
        unique_id: ambient_monthly_rain
        device_class: precipitation
        state_class: total_increasing
        unit_of_measurement: "in"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.monthlyrainin | float(none) }}

      - name: "Ambient Yearly Rain"
        unique_id: ambient_yearly_rain
        device_class: precipitation
        state_class: total_increasing
        unit_of_measurement: "in"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.yearlyrainin | float(none) }}

      - name: "Ambient Sensor 1 Temperature"
        unique_id: ambient_sensor_1_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.temp1f is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.temp1f | float(none) }}

      # humidity1 is the WH31E channel-1 humidity element. It is frequently absent
      # from the station payload (the element that historically reported the 255
      # sentinel); the sensor stays unavailable until the station reports it again.
      - name: "Ambient Sensor 1 Humidity"
        unique_id: ambient_sensor_1_humidity
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.humidity1 is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.humidity1 | float(none) }}

      - name: "Ambient Soil Moisture 1"
        unique_id: ambient_soil_moisture_1
        state_class: measurement
        unit_of_measurement: "%"
        icon: "mdi:water-percent"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.soilhum1 is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.soilhum1 | float(none) }}

      # --- Fields below replace the defunct sensor.my_weather_station_* entities ---

      # Lux is not in the payload; derive from solar radiation (W/m2 * 126.7),
      # matching the conversion the old ambient integration used.
      - name: "Ambient Illuminance"
        unique_id: ambient_illuminance
        device_class: illuminance
        state_class: measurement
        unit_of_measurement: "lx"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.solarradiation is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ((ld.solarradiation | float(0)) * 126.7) | round(0) }}

      - name: "Ambient Wind Direction Avg 10m"
        unique_id: ambient_wind_direction_avg_10m
        state_class: measurement
        unit_of_measurement: "°"
        icon: "mdi:compass-outline"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.winddir_avg10m is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.winddir_avg10m | float(none) }}

      - name: "Ambient Last Lightning Strike"
        unique_id: ambient_last_lightning_strike
        device_class: timestamp
        icon: "mdi:flash"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.lightning_time is defined
             and (value_json[0].lastData.lightning_time | int(0)) > 0 }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ (((ld.lightning_time | int(0)) / 1000) | as_datetime)
             if (ld.lightning_time | int(0)) > 0 else none }}

      - name: "Ambient Indoor CO2 24h Average"
        unique_id: ambient_indoor_co2_24h
        device_class: carbon_dioxide
        state_class: measurement
        unit_of_measurement: "ppm"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.co2_in_24h_aqin is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.co2_in_24h_aqin | float(none) }}

      - name: "Ambient Indoor PM10"
        unique_id: ambient_indoor_pm10
        device_class: pm10
        state_class: measurement
        unit_of_measurement: "µg/m³"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.pm10_in_aqin is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.pm10_in_aqin | float(none) }}

      - name: "Ambient Indoor PM2.5 AQI"
        unique_id: ambient_indoor_pm25_aqi
        device_class: aqi
        state_class: measurement
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.aqi_pm25_aqin is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.aqi_pm25_aqin | float(none) }}

      - name: "Ambient Indoor PM2.5 AQI 24h Average"
        unique_id: ambient_indoor_pm25_aqi_24h
        device_class: aqi
        state_class: measurement
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.aqi_pm25_24h_aqin is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.aqi_pm25_24h_aqin | float(none) }}

      - name: "Ambient Indoor PM10 AQI 24h Average"
        unique_id: ambient_indoor_pm10_aqi_24h
        device_class: aqi
        state_class: measurement
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.aqi_pm10_24h_aqin is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ ld.aqi_pm10_24h_aqin | float(none) }}

      - name: "Ambient Last Update"
        unique_id: ambient_last_update
        device_class: timestamp
        icon: "mdi:clock-check-outline"
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.date is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ as_datetime(ld.date) if ld.date is defined else none }}

    binary_sensor:

      # Ambient battery fields are 1 = OK, 0 = low. device_class battery uses
      # on = low, so the sensor is "on" only when batt1 reports 0.
      - name: "Ambient Sensor 1 Battery"
        unique_id: ambient_sensor_1_battery
        device_class: battery
        availability: >-
          {{ value_json is defined and value_json is not none and (value_json | length) > 0
             and value_json[0].lastData is defined and value_json[0].lastData.batt1 is defined }}
        value_template: >-
          {% set ld = value_json[0].lastData if value_json else {} %}
          {{ (ld.batt1 | int(1)) == 0 }}

template:
  - binary_sensor:
      - name: "Ambient Weather Data Stale"
        unique_id: ambient_weather_data_stale
        device_class: problem
        icon: "mdi:weather-cloudy-alert"
        availability: "{{ has_value('sensor.ambient_last_update') }}"
        state: >-
          {{ (now() - as_datetime(states('sensor.ambient_last_update'))).total_seconds() > 600 }}
