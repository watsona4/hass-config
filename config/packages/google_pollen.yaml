# =============================================================================
# Google Pollen - Pollen forecast data from Google Pollen API for multiple
# locations (Nearby/Home/RV)
#
# Fetches 5-day pollen forecasts via REST commands triggered by automations,
# then parses the response into template sensors for dashboards and alerting.
#
# Entities created:
#   REST commands:
#     - rest_command.google_pollen_nearby_fetch: Fetches pollen for nearby location
#     - rest_command.google_pollen_home_fetch: Fetches pollen for home location
#     - rest_command.google_pollen_rv_fetch: Fetches pollen for RV location
#
#   Base sensors (event-triggered, store raw API response):
#     - sensor.google_pollen_nearby: Raw pollen data for nearby location
#     - sensor.google_pollen_home: Raw pollen data for home location
#     - sensor.google_pollen_rv: Raw pollen data for RV location
#
#   Derived sensors (per location - Nearby/Home/RV):
#     - sensor.google_pollen_*_today: Dominant pollen type with values/colors
#     - sensor.pollen_species_*_today: Top species with category/value/picture
#     - sensor.pollen_forecast_*_day_0/1/2: 3-day forecast with dominant/species
#     - sensor.pollen_species_list_*_today: Full species list attribute
#     - sensor.pollen_peak_index_*_today: Maximum pollen index value
#
#   Automations:
#     - Google Pollen Nearby: 10-min fetch with 0-20s jitter
#     - Google Pollen Home: 10-min fetch with 20-40s jitter (staggered)
#     - Google Pollen RV: 10-min fetch with 40-60s jitter (staggered)
#
# Key attributes:
#   - dominant_value: Numeric pollen index (0-5 scale)
#   - dominant_category: Text category (None, Very Low, Low, Moderate, High, Very High)
#   - dominant_hex: Color code for UI display
#   - grass_value/tree_value/weed_value: Per-type index values
#   - recommendations: Health recommendations array
#
# Dependencies:
#   - macros/rest_helpers.jinja: Location coordinate macros (nearby_lat, home_lon, etc.)
#   - metrics/pollen/pollen.jinja: build_ctx macro for parsing API responses
#   - secrets.yaml: google_pollen_api_key
#   - device_tracker.rv_gps: For RV location availability check
# =============================================================================

# -----------------------------------------------------------------------------
# REST commands: Google Pollen API endpoints
# Note: api_key is passed in from automation data (keeps !secret out of command)
# -----------------------------------------------------------------------------
rest_command:
  google_pollen_nearby_fetch:
    url: >-
      {%- from 'macros/rest_helpers.jinja' import nearby_lat, nearby_lon -%}
      https://pollen.googleapis.com/v1/forecast:lookup?location.latitude={{ nearby_lat() }}&location.longitude={{ nearby_lon() }}&days=5&languageCode=en&key={{ api_key }}
    method: GET
    timeout: 8
    headers:
      Accept: application/json
      User-Agent: HomeAssistant
      Cache-Control: no-cache

  google_pollen_home_fetch:
    url: >-
      {%- from 'macros/rest_helpers.jinja' import home_lat, home_lon -%}
      https://pollen.googleapis.com/v1/forecast:lookup?location.latitude={{ home_lat() }}&location.longitude={{ home_lon() }}&days=5&languageCode=en&key={{ api_key }}
    method: GET
    timeout: 8
    headers:
      Accept: application/json
      User-Agent: HomeAssistant
      Cache-Control: no-cache

  google_pollen_rv_fetch:
    url: >-
      {%- from 'macros/rest_helpers.jinja' import rv_lat, rv_lon -%}
      https://pollen.googleapis.com/v1/forecast:lookup?location.latitude={{ rv_lat() }}&location.longitude={{ rv_lon() }}&days=5&languageCode=en&key={{ api_key }}
    method: GET
    timeout: 8
    headers:
      Accept: application/json
      User-Agent: HomeAssistant
      Cache-Control: no-cache

# -----------------------------------------------------------------------------
# Template sensors (shared structure, per location)
# -----------------------------------------------------------------------------
template:

  - trigger:
      - platform: event
        event_type: google_pollen_nearby_update
    sensor:
      - name: "Google Pollen Nearby"
        unique_id: 3606204b-9f48-d5f4-4e6b-4b65f618d191
        availability: "{{ trigger.event.data.available | default(false) }}"
        state: >-
          {%- set data =
                trigger.event.data.parsed
                if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
          {%- if data is mapping and data.error is not defined -%}
            {%- set di = data.get('dailyInfo') or [] -%}
            {{ states(this.entity_id) if (di | count) == 0 else now().isoformat() }}
          {%- else -%}
            {{ states(this.entity_id) }}
          {%- endif -%}
        attributes:
          dailyInfo: >-
            {%- set data =
                  trigger.event.data.parsed
                  if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                  else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
            {{ data.get('dailyInfo') }}
          plantInfo: >-
            {%- set data =
                  trigger.event.data.parsed
                  if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                  else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
            {{ data.get('plantInfo') }}

  - trigger:
      - platform: event
        event_type: google_pollen_home_update
    sensor:
      - name: "Google Pollen Home"
        unique_id: 3e4b413c-91b1-c684-f6d3-465756034021
        availability: "{{ trigger.event.data.available | default(false) }}"
        state: >-
          {%- set data =
                trigger.event.data.parsed
                if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
          {%- if data is mapping and data.error is not defined -%}
            {%- set di = data.get('dailyInfo') or [] -%}
            {{ states(this.entity_id) if (di | count) == 0 else now().isoformat() }}
          {%- else -%}
            {{ states(this.entity_id) }}
          {%- endif -%}
        attributes:
          dailyInfo: >-
            {%- set data =
                  trigger.event.data.parsed
                  if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                  else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
            {{ data.get('dailyInfo') }}
          plantInfo: >-
            {%- set data =
                  trigger.event.data.parsed
                  if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                  else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
            {{ data.get('plantInfo') }}

  - trigger:
      - platform: event
        event_type: google_pollen_rv_update
    sensor:
      - name: "Google Pollen RV"
        unique_id: aa882f5f-21d0-03c4-fbbb-aa9ae4444a27
        availability: "{{ trigger.event.data.available | default(false) and has_value('device_tracker.rv_gps') }}"
        state: >-
          {%- set data =
                trigger.event.data.parsed
                if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
          {%- if data is mapping and data.error is not defined -%}
            {%- set di = data.get('dailyInfo') or [] -%}
            {{ states(this.entity_id) if (di | count) == 0 else now().isoformat() }}
          {%- else -%}
            {{ states(this.entity_id) }}
          {%- endif -%}
        attributes:
          dailyInfo: >-
            {%- set data =
                  trigger.event.data.parsed
                  if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                  else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
            {{ data.get('dailyInfo') }}
          plantInfo: >-
            {%- set data =
                  trigger.event.data.parsed
                  if (trigger and trigger.event and trigger.event.data.parsed is mapping)
                  else ((trigger.event.data.parsed | default('') | from_json(default={}))) -%}
            {{ data.get('plantInfo') }}

  # ================= NEARBY =================
  - trigger:
      - platform: state
        entity_id: sensor.google_pollen_nearby
    variables:
      src: sensor.google_pollen_nearby
      ctx: >-
        {%- from 'metrics/pollen/pollen.jinja' import build_ctx -%}
        {{ build_ctx(src) | from_json(default={}) }}
      d0: >-
        {%- set di = ctx.di if ctx is mapping and 'di' in ctx else [] -%}
        {{ (di[0] if di is sequence and (di | count) > 0 else {}) }}
      types: >-
        {{ (d0.get('pollenTypeInfo') or []) }}
      ranked: >-
        {{ (types
            | selectattr('indexInfo','defined')
            | selectattr('indexInfo.value','defined')
            | sort(attribute='indexInfo.value', reverse=true)
            | list) }}
      top: >-
        {{ (ranked[0] if ranked | count > 0 else {}) }}
      has_vals: "{{ ranked | count > 0 }}"
      neutral_hex: "#9E9E9E"
      di_attr: "{{ state_attr(src, 'dailyInfo') or [] }}"
      d0_attr: "{{ di_attr[0] if di_attr|count>0 else {} }}"
      plants_fallback: "{{ d0_attr.get('plantInfo') or [] }}"
    sensor:
      - name: "Google Pollen Nearby Today"
        unique_id: 5afa2d1c-6166-5f44-de4b-4d0639d38c71
        icon: mdi:flower-pollen
        availability: "{{ has_value(src) and ((ctx.di | count) > 0) }}"
        state: "{{ (top.get('displayName') or top.get('code')) if has_vals else 'none' }}"
        attributes:
          date: >-
            {%- set dt = d0.get('date') or {} -%}
            {{ "%04d-%02d-%02d"|format(dt.get('year',0),dt.get('month',0),dt.get('day',0)) if dt else none }}
          dominant_value: "{{ (top.get('indexInfo') or {}).get('value') if has_vals else 0 }}"
          dominant_category: "{{ (top.get('indexInfo') or {}).get('category') if has_vals else 'none' }}"
          dominant_hex: >-
            {%- if has_vals -%}
              {%- set c = (top.get('indexInfo') or {}).get('color') or {} -%}
              {%- set r = (c.get('red') or 0) * 255 -%}
              {%- set g = (c.get('green') or 0) * 255 -%}
              {%- set b = (c.get('blue') or 0) * 255 -%}
              {{ '#%02X%02X%02X'|format(r|round(0)|int(0), g|round(0)|int(0), b|round(0)|int(0)) }}
            {%- else -%}
              {{ neutral_hex }}
            {%- endif -%}
          grass_value: >-
            {%- set xlist = (types | selectattr('code','eq','GRASS') | list) -%}
            {{ ((xlist[0].get('indexInfo') or {}).get('value')) if (has_vals and xlist|count>0) else 0 }}
          tree_value: >-
            {%- set xlist = (types | selectattr('code','eq','TREE') | list) -%}
            {{ ((xlist[0].get('indexInfo') or {}).get('value')) if (has_vals and xlist|count>0) else 0 }}
          weed_value: >-
            {%- set xlist = (types | selectattr('code','eq','WEED') | list) -%}
            {{ ((xlist[0].get('indexInfo') or {}).get('value')) if (has_vals and xlist|count>0) else 0 }}
          recommendations: "{{ (ranked[0].get('healthRecommendations') or []) | unique | list if has_vals else [] }}"

      - name: "Pollen Species Nearby Today"
        unique_id: 14c1c6bb-2648-cb24-3a03-92798ca3b62d
        icon: mdi:leaf
        availability: "{{ has_value(src) and ( (ctx.plants | count) > 0 or (plants_fallback | count) > 0 ) }}"
        state: >-
          {{ ctx.pick.name if (ctx.plants | count) > 0 else
              (plants_fallback[0].get('displayName') if (plants_fallback|count>0) else 'none') }}
        attributes:
          code: >-
            {{ ctx.pick.code if (ctx.plants | count) > 0 else
                (plants_fallback[0].get('code') if (plants_fallback|count>0) else none) }}
          type: "{{ ctx.pick.type if (ctx.plants | count) > 0 else none }}"
          in_season: "{{ ctx.pick.in_season if (ctx.plants | count) > 0 else none }}"
          category: "{{ ctx.pick.category if (ctx.plants | count) > 0 else 'none' }}"
          value: "{{ ctx.pick.value if (ctx.plants | count) > 0 else 0 }}"
          entity_picture: "{{ ctx.pick.picture if (ctx.plants | count) > 0 else none }}"

      - name: "Pollen Forecast Nearby Day 0"
        unique_id: 04f21dd5-c4bc-3254-036b-d65039948868
        icon: mdi:calendar-today
        availability: "{{ (ctx.days | count) > 0 }}"
        state: >-
          {%- if (ctx.days | count) > 0 and (ctx.days[0].get('exists') | default(false)) -%}
            {{ ctx.days[0].get('state') or 'unknown' }}
          {%- else -%}
            none
          {%- endif -%}
        attributes:
          date: "{{ (ctx.days[0].get('date') if (ctx.days|count)>0 else none) }}"
          dominant_type: "{{ (ctx.days[0].get('dominant_type') if (ctx.days|count)>0 else none) or 'none' }}"
          dominant_value: "{{ (ctx.days[0].get('dominant_value') if (ctx.days|count)>0 else 0) | default(0) }}"
          dominant_category: "{{ (ctx.days[0].get('dominant_category') if (ctx.days|count)>0 else 'none') }}"
          dominant_hex: "{{ (ctx.days[0].get('dominant_hex') if (ctx.days|count)>0 else neutral_hex) }}"
          species_name: "{{ (ctx.days[0].get('species_name') if (ctx.days|count)>0 else none) }}"
          species_value: "{{ (ctx.days[0].get('species_value') if (ctx.days|count)>0 else 0) }}"
          species_category: "{{ (ctx.days[0].get('species_category') if (ctx.days|count)>0 else 'none') }}"
          species_type: "{{ (ctx.days[0].get('species_type') if (ctx.days|count)>0 else none) }}"
          species_picture: "{{ (ctx.days[0].get('species_picture') if (ctx.days|count)>0 else none) }}"

      - name: "Pollen Forecast Nearby Day 1"
