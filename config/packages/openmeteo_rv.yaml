automation:
  - alias: "OpenMeteo RV"
    id: 36af5936-a64e-b0a4-0b2b-2c54c4921b4b
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    conditions:
      - condition: template
        value_template: >-
          {%- from 'macros/rest_helpers.jinja' import rv_is_valid -%}
          {{ rv_is_valid() | bool }}
    action:
      - delay:
          seconds: "{{ range(0, 900) | random | int }}"
      - service: rest_command.openmeteo_rv_fetch
        response_variable: resp
      - variables:
          ok: "{{ resp is mapping and (resp.status | int(0)) == 200 }}"
          parsed_obj: >-
            {{ resp.content if resp is mapping and resp.content is mapping
                else (resp.content | default('') | string | from_json(default={})) }}
      - event: openmeteo_rv_update
        event_data:
          available: "{{ ok }}"
          parsed: "{{ parsed_obj | tojson }}"
