        unit_of_measurement: "°F"
        availability: "{{- has_value('sensor.openmeteo_rv') and (state_attr('sensor.openmeteo_rv','current') is mapping) -}}"
        state: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('temperature_2m') -}}"
