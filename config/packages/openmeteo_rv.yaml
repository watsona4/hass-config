# =====================================================================================
# OpenMeteo RV - Weather data for RV/mobile location
#
# Fetches forecast data from Open-Meteo API every 15 minutes with random jitter.
# Location coordinates come from macros/rest_helpers.jinja (rv_lat, rv_lon, rv_alt).
# Only fetches when rv_is_valid() returns true (RV has valid GPS coordinates).
#
# Entities created:
#   - weather.openmeteo_weather_rv: Full weather entity with current + forecast
#   - sensor.openmeteo_rv: Raw API data (temperature state, full response in attributes)
#   - sensor.openmeteo_rv_temperature: Current temperature
#   - sensor.openmeteo_rv_apparent_temperature: Feels-like temperature
#   - sensor.openmeteo_rv_humidity: Relative humidity
#   - sensor.openmeteo_rv_dew_point: Dew point temperature
#   - sensor.openmeteo_rv_uv_index: Current UV index
#   - sensor.openmeteo_rv_wind_*: Wind speed, gust, direction
#   - sensor.openmeteo_rv_*_uv_index_max: Today/tomorrow/day2 max UV forecasts
#   - sensor.openmeteo_rv_today_precip_*: Precipitation sum and probability
#   - binary_sensor.openmeteo_rv_uv_protection: True when UV exceeds 3.5 threshold
#   - sensor.openmeteo_rv_safe_exposure_*_st[1-6]: Safe sun exposure by skin type
#
# Jinja dependencies:
#   - macros/rest_helpers.jinja: Location coordinate macros + rv_is_valid() check
#   - metrics/weather/forecasts.jinja: Condition mapping and forecast formatting
#   - metrics/uv/protection_window.jinja: UV threshold time window calculation
#   - metrics/uv/exposure_st.jinja: Safe exposure time by Fitzpatrick skin type
# =====================================================================================

rest_command:
  openmeteo_rv_fetch:
    url: >-
      {%- from 'macros/rest_helpers.jinja' import rv_lat, rv_lon, rv_alt -%}
      https://api.open-meteo.com/v1/forecast?latitude={{ rv_lat() }}&longitude={{ rv_lon() }}&elevation={{ rv_alt() }}&timezone=auto&current=apparent_temperature,cloud_cover,dew_point_2m,is_day,relative_humidity_2m,surface_pressure,temperature_2m,uv_index,visibility,weather_code,wind_direction_10m,wind_gusts_10m,wind_speed_10m&daily=precipitation_probability_max,precipitation_sum,rain_sum,snowfall_sum,sunrise,sunset,temperature_2m_max,temperature_2m_min,uv_index_max,weather_code,wind_gusts_10m_max,wind_direction_10m_dominant,wind_speed_10m_max&hourly=apparent_temperature,cloud_cover,dew_point_2m,is_day,precipitation,precipitation_probability,relative_humidity_2m,surface_pressure,temperature_2m,uv_index,weather_code,wind_direction_10m,wind_gusts_10m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&forecast_hours=24
    method: GET
    timeout: 60
    headers:
      Accept: application/json
      User-Agent: HomeAssistant
      Cache-Control: no-cache

template:

  - weather:
      - name: "OpenMeteo Weather RV"
        unique_id: 6fed3a02-6e9b-7344-00eb-1bb259e9dd15
        availability: "{{ has_value('sensor.openmeteo_rv') }}"
        condition_template: >
          {%- from 'metrics/weather/forecasts.jinja' import current_condition -%}
          {{- current_condition('sensor.openmeteo_rv') -}}
        apparent_temperature_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('apparent_temperature') -}}"
        cloud_coverage_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('cloud_cover') -}}"
        dew_point_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('dew_point_2m') -}}"
        humidity_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('relative_humidity_2m') -}}"
        pressure_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('surface_pressure') -}}"
        temperature_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('temperature_2m') -}}"
        visibility_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('visibility') -}}"
        wind_bearing_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('wind_direction_10m') -}}"
        wind_gust_speed_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('wind_gusts_10m') -}}"
        wind_speed_template: "{{- (state_attr('sensor.openmeteo_rv','current') or {}).get('wind_speed_10m') -}}"
        precipitation_unit: "in"
        pressure_unit: "hPa"
        temperature_unit: "°F"
        visibility_unit: "m"
        wind_speed_unit: "mph"
        forecast_daily_template: >
          {%- from 'metrics/weather/forecasts.jinja' import forecast_daily -%}
          {{- forecast_daily('sensor.openmeteo_rv') | from_json(default={}) -}}
        forecast_hourly_template: >
          {%- from 'metrics/weather/forecasts.jinja' import forecast_hourly -%}
          {{- forecast_hourly('sensor.openmeteo_rv') | from_json(default={}) -}}

  - trigger:
      - platform: event
        event_type: openmeteo_rv_update
    sensor:
      - name: "OpenMeteo RV"
        unique_id: ed5ee531-bf7b-7b24-6e1b-3516782452d2
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "°F"
        availability: >-
          {{ trigger is not none
             and trigger.event is not none
             and trigger.event.data is mapping
             and (trigger.event.data.available | default(false)) }}
        state: >-
          {%- set data = trigger.event.data.parsed if trigger and trigger.event and trigger.event.data.parsed is mapping else {} -%}
          {%- set cur = data.get('current') or {} -%}
          {%- set t = cur.get('temperature_2m') -%}
          {{ t if t is not none else states(this.entity_id) }}
        attributes:
          timezone: "{{ trigger.event.data.parsed.timezone if trigger else none }}"
          timezone_abbreviation: "{{ trigger.event.data.parsed.timezone_abbreviation if trigger else none }}"
          elevation: "{{ trigger.event.data.parsed.elevation if trigger else none }}"
          current_units: "{{ trigger.event.data.parsed.current_units if trigger else none }}"
          current: "{{ trigger.event.data.parsed.current if trigger else none }}"
          hourly_units: "{{ trigger.event.data.parsed.hourly_units if trigger else none }}"
          hourly: "{{ trigger.event.data.parsed.hourly if trigger else none }}"
          daily_units: "{{ trigger.event.data.parsed.daily_units if trigger else none }}"
          daily: "{{ trigger.event.data.parsed.daily if trigger else none }}"

  - sensor:
      - name: "OpenMeteo RV Temperature"
        unique_id: 5aee3ace-d525-42b3-a677-dda08dd5486d
