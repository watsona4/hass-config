# =============================================================================
# Electric Blanket - Auto-shutoff automation for bedroom electric blanket
#
# Monitors power draw to detect when blanket is actively heating. After a
# configurable warmup period, automatically cycles the switch to reset the
# blanket's internal timer (prevents overheating/fire hazard).
#
# Entities created:
#   Automations:
#     - automation.electric_blanket: Power-based auto-shutoff with configurable duration
#
# Dependencies:
#   - binary_sensor.master_bedroom_electric_blanket_drawing_power: Power draw detection
#   - number.master_bedroom_electric_blanket_warmup_hours: Configurable warmup duration
#   - switch.master_bedroom_electric_blanket_switch: Smart plug control
# =============================================================================

# -----------------------------------------------------------------------------
# Automations
# -----------------------------------------------------------------------------
automation:
  - alias: "Electric Blanket"
    id: 38068c7d-4bf8-4966-b94e-9cc385b876aa
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.master_bedroom_electric_blanket_drawing_power
        to: "on"

    action:
      - variables:
          hours: "{{ states('number.master_bedroom_electric_blanket_warmup_hours') | float(4) }}"
          seconds: "{{ (hours * 3600) | int }}"

      - wait_for_trigger:
          - platform: state
            entity_id: binary_sensor.master_bedroom_electric_blanket_drawing_power
            to: "off"
        timeout: "{{ seconds }}"
        continue_on_timeout: true

      - if:
          - "{{ wait.trigger is none }}"
        then:
          - service: switch.turn_off
            target:
              entity_id: switch.master_bedroom_electric_blanket_switch
          - delay: "00:00:10"
          - service: switch.turn_on
            target:
              entity_id: switch.master_bedroom_electric_blanket_switch
