# -----------------------------------------------------------------------------
# Automations: ~15 min cadence with random 0-900s jitter to spread API calls
# Pass waqi token from secrets via data (templated into URL)
# -----------------------------------------------------------------------------
automation:
  - alias: "WAQI Nearby"
    id: 8f3a2b1c-5d6e-4f7a-9b8c-1d2e3f4a5b6c
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    conditions:
      - condition: template
        value_template: >-
          {%- from 'macros/rest_helpers.jinja' import nearby_is_valid -%}
          {{- nearby_is_valid() | bool -}}
    action:
      - delay:
          seconds: "{{ range(0, 900) | random | int }}"
      - service: rest_command.waqi_nearby_fetch
        data:
          token: !secret waqi_token
        response_variable: resp
      - variables:
          ok: "{{ resp is mapping and (resp.status | int(0)) == 200 and (resp.content is mapping or resp.content | string != '') }}"
          parsed_obj: >-
            {{ resp.content if resp is mapping and resp.content is mapping
               else (resp.content | default('') | string | from_json(default={})) }}
      - event: waqi_nearby_update
        event_data:
          available: "{{ ok }}"
          parsed: "{{ parsed_obj | tojson }}"

  - alias: "WAQI Home"
    id: 7e2b1a0c-4d5f-3e6a-8b9c-0d1e2f3a4b5c
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    conditions:
      - condition: template
        value_template: >-
          {%- from 'macros/rest_helpers.jinja' import home_is_valid -%}
          {{- home_is_valid() | bool -}}
    action:
      - delay:
          seconds: "{{ range(0, 900) | random | int }}"
      - service: rest_command.waqi_home_fetch
        data:
          token: !secret waqi_token
        response_variable: resp
      - variables:
          ok: "{{ resp is mapping and (resp.status | int(0)) == 200 and (resp.content is mapping or resp.content | string != '') }}"
          parsed_obj: >-
            {{ resp.content if resp is mapping and resp.content is mapping
               else (resp.content | default('') | string | from_json(default={})) }}
      - event: waqi_home_update
        event_data:
          available: "{{ ok }}"
          parsed: "{{ parsed_obj | tojson }}"

  - alias: "WAQI RV"
    id: 6d1a0b9c-3e4f-2d5a-7b8c-9e0f1a2b3c4d
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    conditions:
      - condition: template
        value_template: >-
          {%- from 'macros/rest_helpers.jinja' import rv_is_valid -%}
          {{- rv_is_valid() | bool -}}
    action:
      - delay:
          seconds: "{{ range(0, 900) | random | int }}"
      - service: rest_command.waqi_rv_fetch
        data:
          token: !secret waqi_token
        response_variable: resp
      - variables:
          ok: "{{ resp is mapping and (resp.status | int(0)) == 200 and (resp.content is mapping or resp.content | string != '') }}"
          parsed_obj: >-
            {{ resp.content if resp is mapping and resp.content is mapping
               else (resp.content | default('') | string | from_json(default={})) }}
      - event: waqi_rv_update
        event_data:
          available: "{{ ok }}"
          parsed: "{{ parsed_obj | tojson }}"
