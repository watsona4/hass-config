# =============================================================================
# WAQI - World Air Quality Index data for multiple locations (Nearby/Home/RV)
#
# Fetches air quality data from WAQI API every 15 minutes with staggered jitter.
# Data includes AQI, individual pollutant indices (PM2.5, PM10, O3, CO, NO2, SO2),
# weather conditions, and 5-day forecasts.
#
# Entities created:
#   REST commands:
#     - rest_command.waqi_nearby_fetch: Fetches AQI for nearby location
#     - rest_command.waqi_home_fetch: Fetches AQI for home location
#     - rest_command.waqi_rv_fetch: Fetches AQI for RV location
#
#   Base sensors (event-triggered, store raw API response):
#     - sensor.waqi_nearby: Raw WAQI data for nearby location
#     - sensor.waqi_home: Raw WAQI data for home location
#     - sensor.waqi_rv: Raw WAQI data for RV location
#
#   Derived sensors (per location - Nearby/Home/RV):
#     - sensor.waqi_*_aqi: Main AQI value with station/dominant pollutant attrs
#     - sensor.waqi_*_pm2_5: PM2.5 particulate matter index
#     - sensor.waqi_*_pm10: PM10 particulate matter index
#     - sensor.waqi_*_temperature: Station temperature
#     - sensor.waqi_*_humidity: Station humidity
#     - sensor.waqi_*_wind_speed: Wind speed
#     - sensor.waqi_*_wind_gust: Wind gust speed
#     - sensor.waqi_*_o3: Ozone index
#     - sensor.waqi_*_co: Carbon monoxide index
#     - sensor.waqi_*_no2: Nitrogen dioxide index
#     - sensor.waqi_*_so2: Sulfur dioxide index
#     - sensor.aqi_forecast_*_day_0/1/2/3/4: 5-day AQI forecasts
#
#   Automations:
#     - automation.waqi_nearby: 15-min fetch with 0-10s jitter
#     - automation.waqi_home: 15-min fetch with 10-20s jitter (staggered)
#     - automation.waqi_rv: 15-min fetch with 20-30s jitter (staggered)
#
# Key attributes:
#   - idx: Station index ID
#   - city: Station location info
#   - dominentpol: Dominant pollutant code
#   - iaqi: Individual AQI values per pollutant
#   - forecast: Multi-day forecast data
#   - attributions: Data source attributions
#
# Dependencies:
#   - macros/rest_helpers.jinja: Location coordinate macros (*_lat, *_lon, *_is_valid, waqi_url)
#   - metrics/air_quality/helpers.jinja: aqi_state_from_payload, iaqi, forecast_days macros
#   - secrets.yaml: waqi_token
#   - device_tracker.rv_gps: For RV location availability check
# =============================================================================

# -----------------------------------------------------------------------------
# REST commands: WAQI API endpoints
# Token is injected by the automation using !secret
# -----------------------------------------------------------------------------
rest_command:
  waqi_nearby_fetch:
    url: >-
      {%- from 'macros/rest_helpers.jinja' import nearby_lat, nearby_lon, waqi_url -%}
      {{ waqi_url(nearby_lat(), nearby_lon()) }}?token={{ token }}
    method: GET
    timeout: 15
    headers:
      Accept: application/json
      User-Agent: HomeAssistant
      Cache-Control: no-cache

  waqi_home_fetch:
    url: >-
      {%- from 'macros/rest_helpers.jinja' import home_lat, home_lon, waqi_url -%}
      {{ waqi_url(home_lat(), home_lon()) }}?token={{ token }}
    method: GET
    timeout: 15
    headers:
      Accept: application/json
      User-Agent: HomeAssistant
      Cache-Control: no-cache

  waqi_rv_fetch:
    url: >-
      {%- from 'macros/rest_helpers.jinja' import rv_lat, rv_lon, waqi_url -%}
      {{ waqi_url(rv_lat(), rv_lon()) }}?token={{ token }}
    method: GET
    timeout: 15
    headers:
      Accept: application/json
      User-Agent: HomeAssistant
      Cache-Control: no-cache

# -----------------------------------------------------------------------------
# Template sensors
# -----------------------------------------------------------------------------
template:
  # ---------------------------------------------------------------------------
  # Base sensors: Event-triggered, store raw API response
  # ---------------------------------------------------------------------------

  # Nearby base sensor
  - trigger:
      - platform: event
        event_type: waqi_nearby_update
    variables:
      root: >-
        {{ trigger.event.data.parsed if trigger.event.data.parsed is mapping
          else (trigger.event.data.parsed | default('') | from_json(default={})) }}
    sensor:
      - name: "WAQI Nearby"
        unique_id: 23cf0257-322d-4785-8d81-95e6f89bf1c7
        state_class: measurement
        availability: "{{ trigger.event.data.available | default(false) }}"
        state: >-
          {%- from 'metrics/air_quality/helpers.jinja' import aqi_state_from_payload -%}
          {{- aqi_state_from_payload(root, this.entity_id) -}}
        attributes:
          idx: "{{ root.get('data',{}).get('idx') }}"
          attributions: "{{ root.get('data',{}).get('attributions') }}"
          city: "{{ root.get('data',{}).get('city') }}"
          dominentpol: "{{ root.get('data',{}).get('dominentpol') }}"
          iaqi: "{{ root.get('data',{}).get('iaqi') }}"
          time: "{{ root.get('data',{}).get('time') }}"
          forecast: "{{ root.get('data',{}).get('forecast') }}"

